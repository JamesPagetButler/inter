# Relation types v1 registry (round 1.1 pre-reg gate 2, inter#300 O4).
#
# §I4 FIX ROUND (qbp-architecture, inter#300, head 7496431): the first cut
# of this file duplicated the signed prose into hand-paraphrased fields
# (meaning/admissibility_test/boundary/...), and the paraphrase silently
# dropped decisive sentences (e.g. proves's "if the subject is an object
# rather than a result, use has-property") and mis-rendered one example
# (⋃ rendered as "colim-of-limits"). A substring-based "is this verbatim"
# check does not catch a truncation, only a full-text mismatch.
#
# Fix: this file now carries ONLY the mechanical/structural facts the
# validator and generator actually need (arity, symmetry, sense values,
# tail kinds, canonical rewrites, the has-property guard, exclusions). It
# holds no prose duplicate of the signed definitions at all. The rubric
# text is generated by STRUCTURALLY PARSING
# relation-definitions-v1-SIGNED.md itself (relation_registry_gen.py's
# parse_signed_doc()) and slicing out each type's full "### N. `id`"
# section byte-for-byte -- verbatim by construction, not by a check that a
# truncation can still pass.
source_sha256: ea3f245e3794afbf11c2759459a44aab3a52ab90b49716f80f3ddd9420e0f2d4
source_file: spikes/run1/vocab/relation-definitions-v1-SIGNED.md
signed_by: qbp-oppenheimer
signed_rev: 3
rejected_relations:
  - id: cites
    reason: "modality, never a relation type (field conventions, all types)"
types:
  - id: proves
    arity: binary
    symmetric: false
  - id: has-property
    arity: binary
    symmetric: false
    guard:
      field: has-property
      threshold: 0.30
      action: "flag paper for review (review flag only, never a hard gate -- threshold is set from round 1.1/1.2 data, not guessed)"
  - id: defines
    arity: binary
    symmetric: false
  - id: equivalent-to
    arity: binary
    symmetric: true
    sense_values: [iff, isomorphic, equal-value, equivalent-category]
  - id: depends-on
    arity: n-ary
    symmetric: false
    tail_kinds: [internal, external]
    closure_label: closed-over-cited
  - id: generalises
    arity: binary
    symmetric: false
    canonical_rewrite: "specialises(A,B) -> generalises(B,A)"
  - id: subobject-of
    arity: binary
    symmetric: false
  - id: counterexample-to
    arity: binary
    symmetric: false
  - id: conjectures
    arity: binary
    symmetric: false
  - id: uses-technique
    arity: binary
    symmetric: false
    weight: low
    excluded_from: ["§6 proof-candidate ranking"]
