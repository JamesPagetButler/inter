# Federation terminal registry — consumed by launch-federation.sh
#
# Format (pipe-delimited, whitespace around | is ignored):
#     persona | workdir | session_id
#
#   persona     : label for the tab/window title (and used by AUTO discovery)
#   workdir     : directory the session lives in (the cwd claude was started in)
#   session_id  : a specific UUID to resume, OR the literal word  AUTO
#                 AUTO = at launch, resolve via the sign-on roster (persona +
#                 workdir match), else find the newest *.jsonl in that workdir's
#                 project history that contains this persona's handle and resume
#                 it. If nothing is found (e.g. a freshly-migrated dir with no
#                 prior session), the pane starts a fresh `claude`.
#
# Lines starting with # are skipped — comment out a persona to not launch it
# (e.g. the one whose terminal you're already sitting in).
#
# ─── PER-DIR MIGRATION (inter#58), staged 2026-06-07 ──────────────────────────
# Every persona now runs in its OWN directory, not a shared ~/Documents. This
# eliminates the shared-cwd transcript mtime race that made AUTO unreliable and
# caused stale-local-checkout reads (#245, qbp-cu#58). Each persona's claude
# project history is now keyed to a dedicated dir, so transcripts never interleave.
#   • Most rows are AUTO: roster_sid is now workdir-matched, so the stale
#     ~/Documents roster rows won't resolve — first launch in the new dir starts
#     fresh, then self-heals (the session signs the roster from its new cwd).
#   • edda-implementor stays pinned — it's the proven per-dir pilot (2ac20822,
#     live in ~/Documents/Edda since 2026-06-06), don't disturb a known-good id.
#   • Two QBP personas need worktree isolation (worktree-isolation hard gate):
#     qbp-oppenheimer keeps the main QBP checkout (~/Documents/QBP — its history
#     home, so it's pinned to its verified id cc9bae42, not fresh), and
#     qbp-implementor gets a dedicated worktree (~/Documents/QBP-implementor,
#     branch implementor-home) — fresh, since it never ran in a QBP dir before.
# This is STAGED: it takes effect at the next deliberate `kill` + relaunch.
# Currently-running sessions are untouched until then.
# After first launch, run ./launch-federation.sh refresh to pin the new ids.

# persona            | workdir                      | session_id
