# Federation terminal registry — consumed by launch-federation.sh
#
# THIS FILE IS STRUCTURE, NOT STATE (inter#142 reissue, §I4 addendum). It is
# tracked in git and must stay PIN-FREE — session_id here is always AUTO (or,
# for a not-yet-migrated row, empty). Ephemeral per-boot session-id PINS live
# in the gitignored, sibling overlay file `personas.local.conf` (format:
# `persona | session_id`), which launch-federation.sh layers on top of this
# file at load time and which `refresh` writes to exclusively. This split is
# why a stale pin (e.g. edda's dead 2ac20822) used to get baked permanently
# into the tracked roster — an ephemeral value doesn't belong in a committed
# file. See check-persona-drift.sh / persona-v0.2 §12 for the related
# persona-file drift-check contract.
#
# Format (pipe-delimited, whitespace around | is ignored):
#     persona | workdir | session_id | persona_file
#
#   persona      : label for the tab/window title (and used by AUTO discovery)
#   workdir      : directory the session lives in (the cwd claude was started in)
#   session_id   : AUTO, or empty (3-field row) — resolution order is:
#                  (1) an overlay pin for this persona in personas.local.conf
#                  wins (AC6); else (2) the sign-on roster (persona + workdir
#                  match); else (3) find the newest *.jsonl in that workdir's
#                  project history that contains this persona's handle and
#                  resume it. If nothing is found (e.g. a freshly-migrated dir
#                  with no prior session, or no overlay at all — AC7), the
#                  pane starts a fresh `claude`. A literal non-AUTO UUID here
#                  is still honored for backward compatibility, but new pins
#                  should go in the overlay, not here.
#   persona_file : OPTIONAL 4th column (inter#142) — path, relative to this
#                  (inter) repo, to the persona's canonical persona-definition
#                  file. Always resolved from origin/main (`git show
#                  origin/main:<path>`), never a local/worktree copy — a
#                  resolution failure FAILS LOUD (names the path), it never
#                  silently falls back to the generic boot. Empty/absent =
#                  today's generic onboard (backward-compatible: rows with only
#                  3 fields parse and launch exactly as before). When set:
#                    - a FRESH pane's onboard names the path + "run its §0"
#                      instead of the generic boot text (onboard-federation.sh);
#                    - a RESUMED pane additionally gets a resume re-anchor
#                      send-keys telling it to re-read the file and re-run §0
#                      (launch-federation.sh) — this is what fixes the
#                      2026-09-18 notary identity-loss fault (a forked/stale
#                      def left a resumed seat thinking it was a
#                      qbp-architecture subagent).
#                  See also: check-persona-drift.sh (drift between an on-disk
#                  runtime copy and this origin/main source; persona-v0.2 §12).
#
# Lines starting with # are skipped — comment out a persona to not launch it
# (e.g. the one whose terminal you're already sitting in).
#
# ─── PER-DIR MIGRATION (inter#58), staged 2026-06-07 ──────────────────────────
# Every persona now runs in its OWN directory, not a shared ~/Documents. This
# eliminates the shared-cwd transcript mtime race that made AUTO unreliable and
# caused stale-local-checkout reads (#245, qbp-cu#58). Each persona's claude
# project history is now keyed to a dedicated dir, so transcripts never interleave.
#   • Most rows are AUTO: roster_sid is now workdir-matched, so the stale
#     ~/Documents roster rows won't resolve — first launch in the new dir starts
#     fresh, then self-heals (the session signs the roster from its new cwd).
#   • edda-implementor stays pinned — it's the proven per-dir pilot (2ac20822,
#     live in ~/Documents/Edda since 2026-06-06), don't disturb a known-good id.
#   • Two QBP personas need worktree isolation (worktree-isolation hard gate):
#     qbp-oppenheimer keeps the main QBP checkout (~/Documents/QBP — its history
#     home, so it's pinned to its verified id cc9bae42, not fresh), and
#     qbp-implementor gets a dedicated worktree (~/Documents/QBP-implementor,
#     branch implementor-home) — fresh, since it never ran in a QBP dir before.
# This is STAGED: it takes effect at the next deliberate `kill` + relaunch.
# Currently-running sessions are untouched until then.
# After first launch, run ./launch-federation.sh refresh to pin the new ids.

# persona            | workdir                      | session_id
qbp-architecture     | ~/Documents/inter            | AUTO
qbp-implementor      | ~/Documents/QBP-implementor  | AUTO
qbp-oppenheimer      | ~/Documents/QBP              | AUTO
qbp-cu-implementor   | ~/Documents/QBP-Compute-Unit | AUTO
cth-implementor      | ~/Documents/CTH              | AUTO
wyrd-implementor     | ~/Documents/Wyrd             | AUTO
bma-implementor      | ~/Documents/BMA              | AUTO
contextus-impl       | ~/Documents/Contextus        | AUTO
herschel             | ~/Documents/herschel         | AUTO
notary-implementor   | ~/Documents/notary           | AUTO   | prompt/notary-implementor-launch-prompt.md
edda-implementor     | ~/Documents/Edda             | AUTO
deming               | ~/Documents                 | AUTO   # federation enabler — babysits the team on every boot (see deming-boot.tmpl)
hutchins             | ~/Documents/Craft            | AUTO
# ^ edda-implementor (Bragi): the first persona on the per-dir model, and the
#   proof that per-dir migration works. Its former pin 2ac20822 (resumed
#   post-2026-06-06 gdm-restart) lost its transcript in a host power-failure
#   crash, so as of 2026-08-19 it runs AUTO and self-heals like the rest of the
#   federation — it no longer leads with a pinned id, it leads by example.
# ^ qbp-oppenheimer: worktree-isolation hard gate still applies (main QBP
#   checkout, ~/Documents/QBP) — but its session-id PIN now lives in the
#   gitignored personas.local.conf overlay, not here (inter#142 reissue,
#   §I4 addendum: the tracked file is pin-free). AUTO here + an overlay entry
#   resolves identically to the old inline pin (AC6); a missing overlay falls
#   through to ordinary AUTO discovery (AC7).

