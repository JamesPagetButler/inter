      This TLA+ spec is the formal contract for the Edda compiler's Stage 4
      authority verifier. The verifier must enforce exactly the safety invariants
      INV_ApprovedRequiresAllThreeGaps, INV_CannotSelfGrant, INV_ConsentDownwardOnly,
      INV_RevocationPropagate, and the independence invariants INV_DeniedWhenGap{1,2,3}Fails
      as compile-time or load-time checks. The §10 WMPD scenario is the Stage 4
      acceptance test (documented in spec comments as an 8-step trace).

    gap1_compiler_check: >
      Stage 4 must verify: for every action expression in an Edda program, if the
      action requires a consent_id (application schema authorization matrix declares it),
      then there exists an active, unexpired, unrevoked consent in scope whose
      consent-scope predicate (§5.4) covers this actor × action pair.
      The compiler check is a static annotation: the Edda authorization matrix
      declares consent_id requirements; the compiler emits Gap1-verification calls
      at the call site. At runtime, the verifier evaluates:
        consents[consent_id].active = TRUE ∧
        consents[consent_id].revoked = FALSE ∧
        consents[consent_id].expiry > current_time ∧
        consent_scope_covers(consent_id, actor, action)
      Compiler error: EDDA-AUTH-011 ("Gap1 consent requirement not satisfiable at call site").
      Note: full consent-scope modeling per R3 is required for correctness;
      the TLA+ model's simplified subject=actor check is insufficient here.

    gap2_compiler_check: >
      Stage 4 must verify: for every action expression that requires a named
      capability vocabulary (e.g., `requires: cap(warning_emit, scope=property.locale)`),
      the actor at the call site holds a live cap with the required vocabulary name
      bound to a ring ≥ the required ring via the substrate vocabulary mapping.
      The compiler check is a static type check: capability flow is linear (T2.3);
      the compiler tracks which caps are consumed and which are available at each
      call site. At runtime: Gap2Check(actor, required_ring) as in the TLA+ model.
      Compiler error: EDDA-AUTH-012 ("Gap2 capability not held at call site").
      Grounded in: Capability.lean T2.3 (capability_grants_safe_access, no_capability_means_no_synthesis).

    gap3_compiler_check: >
      Stage 4 must verify: for every cap used in an action, the full delegation chain
      from the cap back to its root authority is valid at the time of the action.
      This is a RUNTIME check (cap lifetimes and revocation status are dynamic), not
      purely a compile-time check. The compiler emits a Gap3ChainWalk(cap_id) call at
      every capability consumption point. The Gap3ChainWalk algorithm:
        1. Start from cap_id
        2. Check: cap.revoked = FALSE ∧ cap.lifetime_end > now
        3. If cap.parent_cap = NullCap: PASS (root reached)
        4. Else: recurse on cap.parent_cap
        5. Any failure along the chain: FAIL (action denied)
      This is the full recursive chain walk per §6.2, NOT the single-hop model
      in Gap3Check. The compiler inserts this call; the runtime evaluates it.
      Compiler error at construction: EDDA-AUTH-013 ("Cap chain cannot be statically
      proven valid; dynamic Gap3 check required").

    cannot_self_grant_compiler_check: >
      When a GrantCap expression appears in Edda code, the compiler must statically
      verify: ring(new_cap) ≤ ring(parent_cap). This is INV_CannotSelfGrant as a
      compile-time check for static grants, and a runtime assertion for dynamic grants.
      For composed caps (cap_a ⊕ cap_b), the compiler verifies the composed ring ≤
      common root ring (§6.1 composition ceiling). Error: EDDA-AUTH-007 (existing).

    consent_downward_only_compiler_check: >
      When a consent grant expression appears in Edda code, the compiler must
      statically verify: the consenter holds a cap at the required ring level.
      Specifically: no consent grant can reference a capability vocabulary that
      the consenter's own caps don't already cover. Error: EDDA-AUTH-009 (existing).

    revocation_propagation_runtime_check: >
      The compiler must emit code that propagates revocation through the delegation
      tree when a RevokeCap event occurs. The runtime must implement transitive
      propagation (not the one-level model in the TLA+ spec). This is a requirement
      for Stage 4: the Gap3ChainWalk will detect stale revocations only if propagation
      has occurred. The authoritative behavior is §7.2 hard revocation semantics.

    open_questions:
      - >
        Q1: Consent-scope predicate design. The TLA+ model simplifies consent.subject = actor.
        The theory's §5.4 says consent authorizes actors within scope, not just the
        subject. The Edda Stage 4 verifier needs a formal definition of "consent scope"
        as a predicate over (consent_id, actor_id, action_class). qbp-architecture
        should specify the ConsentScope algebra before Bragi implements Gap1 checks.
      - >
        Q2: Judge Collective root authority protocol. §6.3 is a placeholder.
        Until specified, the three-gap check for JC-rooted caps is undefined.
        Stage 4 must handle an unknown root authority type gracefully
        (refuse action rather than silently pass or deny).
      - >
        Q3: Soft revocation fallback in Stage 4. If a cap is soft-revoked with a
        fallback cap, does Stage 4 automatically promote to the fallback? Or does it
        deny and require the application to re-request with the fallback cap explicitly?
        The theory (§7.2) says "the artifact falls back" as a river event; Stage 4
        needs a concrete protocol for this.
      - >
        Q4: RevokeCap transitive propagation efficiency. For a deep delegation tree,
        transitive revocation at action-request time (Gap3ChainWalk) may be slow.
        Eager propagation (mark all derived caps revoked at RevokeCap time) is faster
        at query time but requires maintaining the full derivation tree. The TLA+
        spec's one-level RevokeCap model reveals this design tension. Stage 4 must
        choose a propagation strategy and the TLA+ spec should be updated to match.
      - >
        Q5: Schema version in Gap1 check. §4.3 says caps carry their issuing schema
        version; Gap1 evaluation uses the issuing schema. The TLA+ model does not
        include schema versioning. Stage 4 must implement schema-versioned Gap1
        evaluation, particularly for caps issued under now-superseded schemas with
        migration declarations. A separate TLA+ extension for schema migration
        would strengthen this contract.

