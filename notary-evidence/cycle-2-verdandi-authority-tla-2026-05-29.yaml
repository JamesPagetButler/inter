  # =========================================================
  # STATE SPACE BOUND JUSTIFICATION
  # =========================================================
  state_space_bound_justification: >
    The model configuration uses: CapIDs = {c0, c1, c2, c3} (4 caps),
    ActorIDs = {beekeeper, wmpd_app, property_owner, opted_in_client} (4 actors),
    ConsentIDs = {consent_deploy, consent_warning} (2 consents),
    Rings = {user_ring, supervisor_ring} (2 rings, simplified from ℂ/ℍ/𝕆/𝕊),
    MaxTick = 10, MaxDelegationDepth = 3.

    This bound is SUFFICIENT for the safety property class claimed because:

    (1) INDEPENDENCE OF THREE GAPS: To witness that Gap1, Gap2, Gap3 are independent,
    the model needs at least 3 scenarios where exactly 2 of 3 pass. Each scenario
    requires: 1 issued cap (needs 1 slot beyond root), 1 consent, 1 actor making a
    request. With 4 cap slots (c0..c3), 3 delegation scenarios can run concurrently.
    4 cap IDs cover a complete 3-deep chain (c0→c1→c2→c3) plus all revocation variants.

    (2) CANNOT-SELF-GRANT: The axiom is violated only by a GrantCap that issues
    a child cap with higher ring than parent. 2 rings (user_ring, supervisor_ring)
    are sufficient to model this constraint — the check is ring(child) ≤ ring(parent).
    All four combinations (user→user, super→user, super→super, user→super[BLOCKED])
    are reachable with 2 rings. Adding 𝕆/𝕊 tiers would add path count but not new
    property classes for cannot-self-grant.

    (3) CONSENT-DOWNWARD-ONLY: One granter + one active consent is sufficient to
    test the axiom. 2 consent IDs allow testing both active and revoked states
    simultaneously without state-space explosion.

    (4) REVOCATION PROPAGATION: 2 revocation events are sufficient: revoke a
    mid-chain cap and verify the child cap is also revoked. 4 cap IDs provide
    a 3-deep chain for this test.

    (5) WMPD §10 SCENARIO: The worked example requires exactly 4 actors, 3 caps
    (root + delegation + warning_emit), 2 consents, and 1 revocation event.
    The bound covers this trace exactly.

    (6) MaxTick = 10: The §10 trace requires at most 8 state transitions (see
    the trace comments in the spec). MaxTick = 10 provides buffer for temporal
    expiry scenarios (caps that expire before requests are processed).

    WHAT THE BOUND DOES NOT COVER: It does not model the full Wyrd system with
    many actors, deep delegation hierarchies (>3), or distributed revocation
    propagation latency. Those are T5 (production trace) concerns, not T4
    (finite model check) concerns. T4 is the correctness claim for the
    three-gap check logic in isolation.

  # =========================================================
  # SPEC STRUCTURE OVERVIEW
  # =========================================================
  spec_structure:
    state_variables:
      caps: >
        CapID → CapRecord { ring, scope, lifetime_end, revoked, parent_cap, holder }
        Maps each cap ID to its full state. Unissued caps have holder = "none"
        and revoked = TRUE by convention.
      consents: >
        ConsentID → ConsentRecord { subject, active, expiry, revoked }
        Tracks consent state including gap-3-style temporal validity.
      now: "Nat — monotone clock tick"
      action_requests: "Set of ActionRequest records"
      action_outcomes: "Nat → {Approved, Denied, Pending}"
      next_req_id: "Nat — monotone request ID counter"

    key_predicates:
      Gap3Check: >
        cap_id → BOOL. Cap is not revoked, lifetime_end > now, holder ≠ none.
        After RevokeCap propagation, this transitively covers the full chain.
      Gap1Check: >
        (actor, consent_id) → BOOL. Consent is active, not revoked,
        not expired. "none" consent_id returns TRUE (action needs no consent).
      Gap2Check: >
        (actor, required_ring) → BOOL. Actor holds a live cap with
        ring ≥ required_ring.
      ThreeGapApproved: >
        req → BOOL. Conjunction of all three checks.
        This is the exact formal expression of §2's claim.

    safety_invariants:
      INV_ThreeGapsIndependent: >
        Approved actions have valid Gap3 (cap and parent cap live).
        Primary claim: no Approved action with revoked/expired chain.
      INV_ApprovedRequiresAllThreeGaps: >
        Approved ⟹ ThreeGapApproved. Strongest form: all three must pass.
      INV_CannotSelfGrant: >
        ∀ issued cap: ring(cap) ≤ ring(parent_cap).
        Directly encodes §6.1 cannot-self-grant axiom.
      INV_ConsentDownwardOnly: >
        Active consent's subject is a known ActorID.
        Stronger form: subject holds a live cap (downward-only enforcement).
      INV_RevocationPropagate: >
        If cap revoked, all direct children are revoked.
        Encodes §7.2 hard revocation mode.
      INV_DeniedWhenGap1Fails: >
        Gap1 fails ⟹ outcome ≠ Approved. (Independence test 1.)
      INV_DeniedWhenGap2Fails: >
        Gap2 fails ⟹ outcome ≠ Approved. (Independence test 2.)
      INV_DeniedWhenGap3Fails: >
        Gap3 fails ⟹ outcome ≠ Approved. (Independence test 3.)

    liveness_property:
      LIVENESS_ApprovedActionsComplete: >
        ∀ Pending request that passes all three gaps: eventually Approved.
        Requires fair scheduling of ProcessAction. TLC with fairness would
        verify this. Without explicit WF(ProcessAction) in the Spec formula,
        TLC checks only the safety prefix; the liveness property is stated
        for documentation and Walk-phase re-check.

    wmpd_scenario_trace: >
      The §10 scenario is documented as inline comments in the spec
      (section "§10 WORKED EXAMPLE TRACE"). The 8-step trace covers:
      ConsentGrant → GrantCap × 2 → ConsentGrant → RequestAction →
      ProcessAction (Approved) → ConsentRevoke → RequestAction →
      ProcessAction (Denied).
      This witnesses Gap1 failure after revocation while Gap2+Gap3 pass:
      the independence claim.

  # =========================================================
  # CROSS-FORMALISM CORRESPONDENCES
  # =========================================================
  cross_formalism_correspondences:
    - node_id: "NT_CROSS_FORMALISM_CORRESPONDENCE_CAPABILITY_LEAN_TLA"
      description: >
        Wyrd.Capability.Capability A (Lean) ↔ CapRecord in TLA+ caps function.
        The Lean Capability structure has: token : A, nonzero_witness.
        The TLA+ CapRecord has: ring, scope, lifetime_end, revoked, parent_cap, holder.
        The correspondence is: Lean token maps to TLA+ (ring + holder) — the ring
        identifies the Cayley-Dickson subalgebra and the holder is the authorized actor.
        The Lean nonzero_witness (invertibility) maps to TLA+ lifetime_end > 0 ∧ ¬revoked
        — an issued, live cap is the TLA+ analogue of an invertible capability token.
        SEAM: The algebraic invertibility proof in Lean has no TLA+ equivalent;
        TLA+ models the authority-as-state, not the algebraic structure.
      lean_side: "Wyrd/lean/Wyrd/Capability.lean — Capability structure, capability_projects"
      tla_side: "verdandi-authority-three-gap.tla — CapRecord, GrantCap, INV_CannotSelfGrant"

    - node_id: "NT_CROSS_FORMALISM_CORRESPONDENCE_DELEGATION_LEAN_TLA"
      description: >
        Wyrd.Capability.capability_projects (Lean) ↔ GrantCap action in TLA+ spec.
        Lean's capability_projects takes a CayleyDickson cap and returns a narrower-ring
        cap by taking the .l field (the "left" component — the inner ring element).
        TLA+'s GrantCap enforces ring(new_cap) ≤ ring(parent_cap), which is the
        model-level encoding of this narrowing.
        Lean's wider_capability_subsumes_narrower ↔ TLA+'s INV_CannotSelfGrant:
        both express that a wider capability grants all inner-ring capabilities,
        and that the delegation is monotone-narrowing.
      lean_side: "Wyrd/lean/Wyrd/Capability.lean — capability_projects, wider_capability_subsumes_narrower"
      tla_side: "verdandi-authority-three-gap.tla — GrantCap action, INV_CannotSelfGrant invariant"

    - node_id: "NT_CROSS_FORMALISM_CORRESPONDENCE_NEGATIVE_T23_LEAN_TLA"
      description: >
        Wyrd.Capability.no_capability_means_no_synthesis (Lean T2.3 negative part)
        ↔ INV_DeniedWhenGap2Fails in TLA+ spec.
        Lean: without a capability for ring R', no sequence of base-ring ops produces R' values.
        TLA+: Gap2Check fails (no live cap with required_ring held) ⟹ action Denied.
        Both express the same structural confinement: no cap, no access.
        The TLA+ model is behavioral (request denied); Lean is algebraic (no synthesis exists).
      lean_side: "Wyrd/lean/Wyrd/Capability.lean — no_capability_means_no_synthesis"
      tla_side: "verdandi-authority-three-gap.tla — INV_DeniedWhenGap2Fails"

    - node_id: "NT_CROSS_FORMALISM_CORRESPONDENCE_REVOCATION_LEAN_TLA"
      description: >
        Verdandi theory §7.2 hard revocation ↔ RevokeCap action + INV_RevocationPropagate.
        Theory: hard revocation — downstream authority is gone; active state held.
        TLA+ RevokeCap: marks target cap AND all direct children revoked in one atomic step.
        TLA+ INV_RevocationPropagate: invariant asserting that revocation is always propagated.
        SEAM: The theory's "pending work stops" and "active state marked held" semantics
        are not modeled (no work queue); TLA+ models the cap revocation and action-denial
        consequences only.
      theory_section: "Verdandi-Authority-Theory-v0.2.md §7.1–7.2"
      tla_side: "verdandi-authority-three-gap.tla — RevokeCap action, INV_RevocationPropagate"

  # =========================================================
  # SEAM RECORDS FIRED
  # =========================================================
  seam_records_fired:
    - node_id: "NT_SEAM_RECORD_CHAIN_WALK_DEPTH"
      description: >
        The theory's Gap 3 check (§6.2) requires a full walk of the delegation chain
        back to the root cap (Algorithm: start from cap Cₙ, walk to Cₙ₋₁, ..., C₀).
        The TLA+ spec models Gap3Check as a single-hop check (cap + immediate parent).
        Transitive correctness is achieved via INV_RevocationPropagate + RevokeCap's
        propagation to immediate children — but the spec does NOT verify correctness
        for chains deeper than 2 in a single predicate evaluation.
        EDDA STAGE 4 IMPLICATION: The compiler must implement the full recursive chain
        walk, not a single-hop check.
      severity: MODELING_SIMPLIFICATION
      scope: "Gap3Check predicate in spec; not an error in the safety invariants"
      action_required: >
        When TLC runs, verify that RevokeCap propagation correctly handles depth-3 chains
        by constructing a 3-deep chain (c0→c1→c2→c3) and checking that revoking c0
        propagates to c1, c2, c3 within 2 RevokeCap steps.
        Note: current RevokeCap only propagates one level per invocation; a
        2-step execution is required for a 3-deep chain. Consider adding a
        RevokeCapTransitive action or strengthening RevokeCap to handle deeper chains.

    - node_id: "NT_SEAM_RECORD_CONSENT_SUBJECT_MODEL"
      description: >
        The theory (§5.4) describes consent as producing authority for actors WITHIN
        the consent's scope — the property owner's consent authorizes wmpd_app to act
        because wmpd_app holds a delegation derived from the consent. The TLA+ model
        simplifies: Gap1Check(actor, consent_id) checks that the consent is active and
        its subject = actor. In the WMPD scenario, the property_owner is the consenting
        subject; wmpd_app acts using a cap chain derived from the consent.
        The model does not represent the full consent-to-cap derivation mapping that
        §5.4 describes as the source of application authority.
      severity: SCOPE_LIMITATION
      scope: "Gap1Check predicate; §10 trace; WMPD scenario modeling"
      action_required: >
        The Edda Stage 4 authority verifier must implement §5.4's consent-scope
        predicate: an action is Gap1-authorized if there exists an active consent
        whose scope covers the (actor, action) pair, not merely if the actor IS the
        consent subject. This is a broader model that the TLA+ spec approximates.
        A more accurate TLA+ encoding would add a ConsentScope function mapping
        ConsentID → Set[ActorID × ActionClass].

    - node_id: "NT_SEAM_RECORD_JUDGE_COLLECTIVE_OMITTED"
      description: >
        §6.3 of the theory lists five root authority types, one of which is the
        Judge Collective. The §6.3 Judge Collective section is explicitly a PLACEHOLDER
        in the theory document ("pending QBP-Architect specification"). This spec
        models only three root types: beekeeper (root cap c0), consent contracts,
        and implicitly infrastructure authority.
        Any TLC result applies only to these three types. When §6.3 is specified,
        the TLA+ model must be extended with a JudgeCollectiveRootAuth action and
        corresponding invariants.
      severity: SCOPE_LIMITATION
      scope: "Root authority modeling"
      action_required: >
        File a follow-up Notary dispatch ticket: when qbp-architecture specifies
        the Judge Collective root authority protocol, extend this TLA+ spec with
        a JudgeCollectiveRootAuth action and verify that JC authority follows the
        same three-gap structure. Cross-reference §6.3 placeholder.

    - node_id: "NT_SEAM_RECORD_SOFT_REVOCATION_OMITTED"
      description: >
        The theory specifies three revocation propagation modes (§7.2): hard,
        soft-with-fallback, retained-with-flag. This spec models only hard revocation.
        INV_RevocationPropagate holds under hard revocation semantics only.
        Soft revocation (fallback to alternative authority) and retained-with-flag
        (history preserved, flagged) require additional state variables and invariants.
      severity: SCOPE_LIMITATION
      scope: "Revocation modeling"
      action_required: >
        Future spec extension: add SoftRevokeCap(cap_id, fallback_cap_id) action
        and RetainWithFlagRevoke(cap_id) action. Add INV for soft revocation:
        if soft-revoked, actor falls back to fallback authority and the action
        is still Approved under the fallback. The retained-with-flag invariant
        would assert that river history is preserved (append-only; flag adds
        to the record, does not delete prior Approved outcomes).

    - node_id: "NT_SEAM_RECORD_RING_TOWER_SIMPLIFIED"
      description: >
        The Wyrd ring tower is ℂ ↛ ℍ ↛ 𝕆 ↛ 𝕊 (four tiers, proved in Foundations.lean T2.1).
        This spec uses two rings: {user_ring, supervisor_ring} corresponding to {ℂ, ℍ}.
        The Octonion (𝕆) and Sedenion (𝕊) tiers are not modeled. This is sufficient
        for the three-gap safety claim (the independence property holds regardless of
        the number of rings) but means the spec does not verify ring-specific properties
        like the sedenion zero-divisor handling (Capability.lean §STATUS) or the
        octonion alternator boundary crossing (Edda v0.2 §4.10).
      severity: SCOPE_LIMITATION
      scope: "Ring algebra modeling"
      action_required: >
        If the authority layer needs explicit reasoning about the 𝕆/𝕊 tiers
        (e.g., infrastructure authority at 𝕊-ring), extend the Rings constant
        to {user_ring, supervisor_ring, kernel_ring, firmware_ring} with
        RingValue mapping them to 1/2/3/4. The safety invariants are unchanged;
        new gap2 interactions with ring-specific operations would need new actions.

    - node_id: "NT_SEAM_RECORD_REVOKECAP_ONE_LEVEL_PROPAGATION"
      description: >
        The current RevokeCap action marks the target cap AND all caps with
        parent_cap = target as revoked (one-level propagation). For a 3-deep chain
        c0→c1→c2→c3, revoking c0 marks c1 revoked but NOT c2 or c3 in one step.
        INV_RevocationPropagate checks: if cap revoked, all DIRECT children revoked.
        This is correct for immediate children but a two-step execution is needed
        to propagate through a depth-3 chain.
        The invariant holds because RevokeCap would need to be called twice —
        once for c0 (propagates to c1) and once for c1 (propagates to c2, c3).
        However, if the model only calls RevokeCap once, c2 and c3 will NOT be
        marked revoked. This is the one case where the model deviates from the
        theory's intent (§7.1: "revocation flows downstream from its target;
        every downstream artifact is reassessed").
      severity: STRUCTURAL_GAP
      scope: "RevokeCap transitive propagation"
      action_required: >
        PRIORITY FIX before T4 claim: Strengthen RevokeCap to propagate transitively
        OR add a RevokePropagateChildren action that is fair-scheduled after any RevokeCap.
        Alternatively, add an explicit transitive-closure computation in RevokeCap:
        caps' = [ c ∈ CapIDs |→
          IF c is reachable from cap_id via parent_cap chain THEN revoked=TRUE ELSE caps[c] ]
        The safety invariants (especially INV_DeniedWhenGap3Fails) depend on this
        transitive property being correctly enforced.

