# ADDENDUM (same day, seq=1370) — CONFIRMATION-DEPTH containment reframe, adopted into Addendum B
# =========================================================
containment_addendum:
  dispatch: "qbp-architecture seq=1370 (adopting notary's consume-before-final reframe into Addendum B)"
  canonical_module: "notary/tla/verdandi_authority_attestation_containment.tla (supersedes the temporal module's admission-race framing; that module kept as historical record)"
  reframe: >
    The harm is NOT admission (admission is safe) — it is IRREVERSIBLE CONSUMPTION of a NOT-YET-FINAL
    admission. Primary invariant moves from ~admitted (superseded, too strong) to
    INV_ContainmentBeatsExploit == ~(consumed /\ ~final). `Delayable` folds architect results #2
    (finality window) and #3 (un-delayable actions) into ONE model.
  invariant_3:
    name: "INV_ContainmentBeatsExploit == ~(consumed /\\ ~final)"
    result: >
      Delayable=TRUE  (D=1,K=2,W=2,RevokePriority=TRUE) -> HOLDS (24 distinct states, 0 on queue):
        a delayable irreversible action waits for finality, so confirmation-depth containment governs it.
      Delayable=FALSE -> COUNTEREXAMPLE: AdmitStep->AdmitStep(admitted)->Consume with final=FALSE ->
        consumed /\ ~final. An un-delayable/time-critical action CANNOT wait for finality, so post-merge
        invalidation provably cannot govern it -> it needs the synchronous actuator-multisig carve-out
        (architect result #3, now a reachable model break rather than prose).
    non_vacuity: >
      CONFIRMED (containment_probe.tla): NoFinal violated (final IS reachable -> admissions finalize) and
      NoConsume violated (consumption DOES happen, after final under Delayable) -> the HOLDS is meaningful.
    trace: "notary/tla/traces/trace_containment_undelayable.txt"
  significance: >
    Adopted into Addendum B by the architect as "a real improvement, not a rename." The formal work
    bottomed out exactly at the policy boundary: confirmation-depth containment is SOUND for delayable
    actions and PROVABLY INSUFFICIENT for un-delayable ones — the delayable/un-delayable categorization
    is therefore a beekeeper policy call, not a safety derivation.

