  # =========================================================
  # SEAM RECORDS
  # =========================================================
  seam_records_fired:
    - node_id: "NT_SEAM_RECORD_OCTONION_GAP"
      description: >
        Lean T2.4 sandwich_mul is proved for an ASSOCIATIVE [Ring A].
        The octonion layer (𝕆) is non-associative (proved in Foundations.lean
        via associator_octonion_witness and no_surjection_quaternion_to_octonion).
        The Go runtime correctly returns ErrTierUnsupported for TierOctonion
        and TierSedenion. However, the Lean proof does NOT extend to the
        octonion sandwich; a separate theorem with weaker hypotheses
        (alternativity instead of full associativity) would be required.

        Capability.lean §STATUS explicitly acknowledges this:
        "Sandwich preservation in NON-ASSOCIATIVE setting (𝕆 layer):
        the sandwich p·u·p⁻¹ behaves slightly differently when
        associativity fails."

        IMPACT: The seam is CONTAINED — Go returns error for these tiers,
        so no incorrect execution occurs. The seam is documentation debt
        (the Lean proof scope vs the claim "capability-mediated cross-ring
        computation is sound") that should be addressed at Walk phase when
        the octonion layer is implemented.
      severity: CONTAINED
      tier_disagreement: "T2.4 proved for ℍ; Go correctly defers 𝕆/𝕊 to error"
      action_required: >
        At Walk phase (when TierOctonion/TierSedenion are implemented):
        file a separate Lean theorem for sandwich under alternativity,
        with a corresponding T2 property-test harness.

    - node_id: "NT_SEAM_RECORD_T3_ORACLE_SHARED_KERNEL"
      description: >
        T3 requires an independent oracle from a different trust base.
        The current mode-(b) harness uses HamiltonProduct → Gearbox.QMul64
        for BOTH the property checks AND the test helpers (sandwichProduct,
        quatInverse). There is no independent numerical implementation.

        This means T3 trust tier cannot be claimed: a systematic arithmetic
        bug that exists identically in both Lean's abstract claim and the
        emulator would not be detected.

        The wyrd PR #67 pattern acknowledges this as the "pragmatic mode-(b)"
        limitation: the drift snapshot catches source-level drift; T3 proper
        requires an independent kernel.
      severity: STRUCTURAL_GAP
      tier_disagreement: "T2 achieved; T3 requires independent oracle (not available in this dispatch)"
      action_required: "Residual obligation R1: independent oracle implementation (see below)"

    - node_id: "NT_SEAM_RECORD_DOCSTRING_CITATION_PATTERN"
      description: >
        quaternion.go T2.4 docstring cites the theorem by name ("sandwich_mul T2.4")
        but does NOT quote the Lean predicate verbatim in the doc-comment.

        The wyrd PR #67 canonical pattern (extract-cycle-counter-proof) established
        the discipline of quoting the Lean predicate verbatim alongside the Go
        implementation so that manual review can confirm both encode the same property.

        quaternion.go deviates from this pattern: the docstring says
        "Wyrd.Capability.sandwich_mul (T2.4) is the load-bearing soundness theorem
        for compositions of this product" but does not inline the theorem statement.

        This is a documentation seam, not a mathematical error.
      severity: DOCUMENTATION_DEBT
      action_required: "Residual obligation R2: add verbatim Lean predicate quote to quaternion.go docstring"

    - node_id: "NT_SEAM_RECORD_MUTATION_COVERAGE_GAP"
      description: >
        Mutation sensitivity analysis shows that mutB (reversed outer order:
        p_inv * (p * u) instead of p * u * p_inv) is NOT detected by P1 or P2.

        The algebraic reason: when testing P1 with FIXED p across both
        sandwich calls, the mutB form satisfies the property vacuously
        (both sides reduce to the same expression). P2 misses it for
        unit quaternions because |p_inv*(p*u)| = |p|²|u| = |u| when |p|=1.

        P3 (composition) is more sensitive to ordering errors and was not
        fully mutation-tested in this session due to resource constraints.
      severity: COVERAGE_GAP
      action_required: >
        Residual obligation R3: extend mutation testing to include mutB
        against P3. Add rotation-matrix-based test that would detect
        wrong outer order for a concrete known rotation.

    - node_id: "NT_SEAM_RECORD_FLOAT64_EXACTNESS"
      description: >
        The Lean theorem sandwich_mul is proved in an EXACT ring. The Go
        implementation uses IEEE 754 float64 arithmetic, which has rounding
        errors of order ULP per operation, accumulating to O(epsilon_machine)
        per three multiplications.

        Properties P1-P3 use epsilon=1e-9, which is ~10^6 × machine epsilon
        (2.2e-16). This epsilon is conservative and not vacuous (mutations
        produce O(1) errors, not O(1e-9) errors), but the underlying
        mathematical claim is that the theorem holds exactly, not approximately.

        This gap is inherent to any float64 implementation of an algebraic
        theorem; it is not specific to the Wyrd implementation. It implies
        that the Go implementation faithfully represents T2.4 "up to the
        precision of float64 arithmetic" — a known and acceptable limitation
        for Crawl phase.
      severity: INHERENT_LIMITATION
      action_required: >
        Document in quaternion.go godoc that float64 arithmetic means
        sandwich_mul holds to ~1e-9 component-wise, not exactly.
        Not a blocking issue for T2 certification.

  # =========================================================
  # RESIDUAL OBLIGATIONS
  # =========================================================
  residual_obligations:
    - id: R1
      description: "Independent oracle for T3 differential"
      detail: >
        Implement an independent reference implementation of Hamilton product
        using Python mpmath or math/big.Float without delegating to Gearbox.QMul64.
        Run differential between reference and Gearbox.QMul64 over 10^6+ inputs.
        Record maximum delta and compare against float64 ULP-per-operation bound.
        This closes the T3 gap and allows trust_tiers_achieved to be extended to [T3].
      effort: "~2-4 hours (Python mpmath reference + Go differential harness)"
      blocking: false

    - id: R2
      description: "Verbatim Lean predicate quote in quaternion.go docstring"
      detail: >
        Add to HamiltonProduct godoc the exact Lean statement of sandwich_mul T2.4,
        as specified in the wyrd PR #67 paired-doc-comment discipline.
        Specifically: the two-line Lean signature of sandwich_mul and its h_inv
        hypothesis should appear in the docstring so that a reader seeing the
        quaternion.go comment can confirm without reading the Lean file.
      effort: "~15 minutes"
      blocking: false
      related_seam: "NT_SEAM_RECORD_DOCSTRING_CITATION_PATTERN"

    - id: R3
      description: "Extend mutation testing to include mutB against P3"
      detail: >
        Add a concrete rotation-matrix test: given a known rotation by π/2 around
        the Z axis (q = (0, 0, 0, 1)/sqrt(2) with appropriate normalization),
        verify that sandwich(q, (1,0,0,0), q_inv) = (-1,0,0,0) vs (1,0,0,0)
        depending on whether the order is correct. This test would catch mutB.
      effort: "~1 hour"
      blocking: false
      related_seam: "NT_SEAM_RECORD_MUTATION_COVERAGE_GAP"

    - id: R4
      description: "Octonion sandwich theorem at Walk phase"
      detail: >
        When TierOctonion is implemented in Go, file a Lean theorem for sandwich
        under alternativity (weaker than associativity) with corresponding T2
        property-test harness. The current T2.4 proof does not cover this tier.
      effort: "Research-scale; deferred to Walk"
      blocking: false
      related_seam: "NT_SEAM_RECORD_OCTONION_GAP"

