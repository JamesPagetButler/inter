  - id: cth:Anchor
    prefLabel: "Anchor (PROOF- / DERIV- / CONJ- / MEAS- / … kinds)"
    definition: >
      A proof-bearing or evidence-bearing ledger record. Its kind is classified by
      provenance_kind (cth:ProvenanceKind); the id prefix is a naming convention
      (QBP-local, 22 prefixes documented, not upstream-registered), e.g. PROOF- formally
      proven, DERIV- derivation, CONJ- conjecture, MEAS- measurement, PRED- prediction,
      OBS- observation. AXIOM-/POST-/META-/INTERP- ids live in the ledger's root lists,
      not among anchors (cth:ROOT-Prefix-Taxonomy). Anchors carry ProofState and, as of
      ledger 6.17.0, the PA-grade fields pa_local / pa_effective (integers 0..2,
      computed-not-declared, CI-reconciled) alongside proof_assistants. Per the CTH/Wyrd
      integration doc, anchors map onto Wyrd Nodes.
    status: derived
    axiom_grounding: "none directly — the general ledger unit that AXIOM-1's own kill_condition entries reference (e.g. PROOF-42zd, DERIV-arrow)."
    broader: []
    narrower: []
    related: [cth:ProofState, cth:AnchorStatus, cth:ProvenanceKind, wyrd:CTHIntegration, cth:proof_assistants, cth:claim-source-manifest, cth:derivation-edge]
