  # ==========================================================================
  # SYSTEMA — workspace process framework
  # ==========================================================================

  - id: systema:TheoryEngineeringCarts
    prefLabel: "Theory Cart / Engineering Cart"
    definition: >
      "The single-cart model obscures a fundamental distinction. Understanding
      a problem and making a thing from that understanding are different
      activities with different tools, outputs, evaluation criteria, and
      review processes." Theory Cart -> Spec (requirements + tests) ->
      Engineering Cart -> Reference Design (test results + compliance) ->
      World (product development). Theory Cart produces TWO outputs (per the
      v0.8 addendum): Theory (general, reusable, built on trust anchors) and
      Spec (specific instance with requirements and tests, depends on theory).
    status: derived
    axiom_grounding: "none — independent process-design lineage (Systema v0.8), not derived from AXIOM-1."
    broader: []
    narrower: [systema:ThreeLoopModel]
    related: [systema:TrustAnchor, systema:OKHDomainTaxonomy]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-spec-v08.md
        quote: "§2, §2.1 heading '## 2.1 The Two Carts', line 75 quote above"
      - file: /home/prime/Documents/Systema/docs/systema-v08-addendum.md
        quote: "§1.1 'Theory Cart: Two Outputs'"
    notes: >
      BEEKEEPER-DECISION / NAMING-DRIFT FLAG: this is the PRIMARY, ratified
      Systema spec definition — verified directly (2026-09-27, grep of both
      systema-spec-v08.md and systema-v08-addendum.md) — and it defines exactly
      TWO carts (Theory, Engineering). The project's own /home/prime/Documents/
      CLAUDE.md refers to "Three Carts (Theory/Engineering/Information)" — an
      "Information Cart" does not appear ANYWHERE in the Systema corpus (zero
      grep hits for "information cart" / "third cart" / "three cart" in either
      spec file). Either CLAUDE.md's phrasing is stale/incorrect, or a third
      cart was proposed somewhere not yet located. This ontology roots on the
      verified Two-Carts model and flags the discrepancy rather than silently
      adopting either claim.
      RESOLVED 2026-09-27 (beekeeper): a "cart" is a flexible *domain / grouping
      of skills* — once skills are lowered to hyperedges (Spike 0), a cart is a
      subgraph or a single domain-binding hyperedge (the OKH "System" domain is
      already this compositional case). So the fixed count (2 vs 3) is NOT
      fundamental; carts are a flexible, nestable partition. Two distinct axes,
      both expressible as groupings: process-kind (Theory=understand /
      Engineering=make — the ratified two-cart distinction) × domain
      (Hardware/Software/Process/Bio/System). CLAUDE.md's "three" is therefore
      not a contradiction, just a non-canonical snapshot of a flexible
      structure — no CLAUDE.md edit is forced by this ontology.

  - id: systema:ThreeLoopModel
    prefLabel: "Three-loop progressive hardening"
    definition: >
      Loop 1 Ideation ("Could this work?", constraint = References/awareness,
      no formal test) -> Loop 2 Architectural ("Will this work?", constraint =
      Guidances/directional) -> Loop 3 Real-World ("Does this work?",
      constraint = Requirements/mandatory). "The engineering cart operates
      through three iterative loops. Each loop tightens the constraint space
      and raises the bar for gate review... the same body of regulatory and
      standards knowledge is present at all three loops but viewed through
      progressively harder lenses."
    status: derived
    axiom_grounding: none
    broader: [systema:TheoryEngineeringCarts]
    narrower: []
    related: [systema:OKHDomainTaxonomy]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-spec-v08.md
        quote: "§3, lines 209-260"
    notes: "The three loops apply identically across every OKH domain (see systema:OKHDomainTaxonomy's Loop1/2/3 table)."

  - id: systema:TrustAnchor
    prefLabel: "Trust Anchor"
    definition: >
      "A trust anchor is an independent piece of evidence that constructively
      reinforces a pattern. When multiple anchors point to the same conclusion
      through different methods, the resulting confidence is greater than any
      single anchor could provide. This is the epistemological foundation the
      entire pipeline stands on." Self-reinforcing / constructive-interference
      property is explicit. AnchorStatus = Active/Weakened/Retracted.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:VigilanceBackflow, cth:Anchor]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-v08-addendum.md
        quote: "§1.2, lines 69-73 (verified directly 2026-09-27)"
    notes: "Distinct concept/term from cth:Anchor (CTH's proof-ledger record) — both use 'anchor' but for different things across projects; worth flagging as a second minor naming overlap alongside the Tier collision."

  - id: systema:VigilanceBackflow
    prefLabel: "Vigilance backflow"
    definition: >
      "The pipeline flows in both directions... Backward flow carries two
      distinct signals: vigilance (something went wrong) and challenge
      identification (something needs doing)." "When harm or failure occurs in
      the world, the signal propagates upstream to the appropriate level" —
      Reference Design (manufacturing defect) -> Spec (design flaw) -> Theory
      (theory error) -> Trust Anchors (anchor failure, "halt everything").
      Severity-dependent reach with corresponding actions (review, hold,
      recall, halt).
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:TrustAnchor, systema:TheoryEngineeringCarts]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-v08-addendum.md
        quote: "§5.1-5.2, lines 385-433 (verified directly 2026-09-27)"
    notes: "Distinct from 'challenge identification' backflow — two separate backward signals per the same section."

  - id: systema:OKHDomainTaxonomy
    prefLabel: "OKH domain taxonomy"
    definition: >
      Five domains classifying OKH manifests by deliverable: Hardware
      (physical artefact, atomic), Software (code that runs, atomic), Process
      (a procedure, atomic), Biological (living-system interventions, atomic),
      System (composition of OKH manifests from any domain, compositional).
      "Hybrid" explicitly rejected as a domain: "A project that combines
      software and hardware... is a system whose sub-components span the
      software and hardware domains."
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:ThreeLoopModel]
    source:
