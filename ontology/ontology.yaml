  - id: systema:TheoryEngineeringCarts
    prefLabel: "Theory Cart / Engineering Cart"
    definition: >
      "The single-cart model obscures a fundamental distinction. Understanding
      a problem and making a thing from that understanding are different
      activities with different tools, outputs, evaluation criteria, and
      review processes." Theory Cart -> Spec (requirements + tests) ->
      Engineering Cart -> Reference Design (test results + compliance) ->
      World (product development). Theory Cart produces TWO outputs (per the
      v0.8 addendum): Theory (general, reusable, built on trust anchors) and
      Spec (specific instance with requirements and tests, depends on theory).
    status: derived
    axiom_grounding: "none — independent process-design lineage (Systema v0.8), not derived from AXIOM-1."
    broader: []
    narrower: [systema:ThreeLoopModel]
    related: [systema:TrustAnchor, systema:OKHDomainTaxonomy]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-spec-v08.md
        quote: "§2, §2.1 heading '## 2.1 The Two Carts', line 75 quote above"
      - file: /home/prime/Documents/Systema/docs/systema-v08-addendum.md
        quote: "§1.1 'Theory Cart: Two Outputs'"
    notes: >
      BEEKEEPER-DECISION / NAMING-DRIFT FLAG: this is the PRIMARY, ratified
      Systema spec definition — verified directly (2026-09-27, grep of both
      systema-spec-v08.md and systema-v08-addendum.md) — and it defines exactly
      TWO carts (Theory, Engineering). The project's own /home/prime/Documents/
      CLAUDE.md refers to "Three Carts (Theory/Engineering/Information)" — an
      "Information Cart" does not appear ANYWHERE in the Systema corpus (zero
      grep hits for "information cart" / "third cart" / "three cart" in either
      spec file). Either CLAUDE.md's phrasing is stale/incorrect, or a third
      cart was proposed somewhere not yet located. This ontology roots on the
      verified Two-Carts model and flags the discrepancy rather than silently
      adopting either claim.
      RESOLVED 2026-09-27 (beekeeper): a "cart" is a flexible *domain / grouping
      of skills* — once skills are lowered to hyperedges (Spike 0), a cart is a
      subgraph or a single domain-binding hyperedge (the OKH "System" domain is
      already this compositional case). So the fixed count (2 vs 3) is NOT
      fundamental; carts are a flexible, nestable partition. Two distinct axes,
      both expressible as groupings: process-kind (Theory=understand /
      Engineering=make — the ratified two-cart distinction) × domain
      (Hardware/Software/Process/Bio/System). CLAUDE.md's "three" is therefore
      not a contradiction, just a non-canonical snapshot of a flexible
      structure — no CLAUDE.md edit is forced by this ontology.

