  - id: contextus:ScopePhysical
    prefLabel: "ScopePhysical (NT_SCOPE_PHYSICAL)"
    definition: >
      "a region of space-time with a name and queryable membership." Its membership
      predicate is geometric intersection: a node is a member iff its Locale
      intersects the scope's geometry and its timestamp falls within temporal_range.
    status: derived
    axiom_grounding: "none — Contextus spec design, an independent lineage."
    broader: []
    narrower: []
    related: [contextus:ScopeConceptual, contextus:ScopeOperational, contextus:ScopeMembership, contextus:membership-predicate-catalogue]
    source:
      - file: /home/prime/Documents/Contextus/pkg/types/scope.go
        quote: "// ScopePhysical is a region of space-time with a name and queryable membership. Spec v1.3 §4.6.2 + §11.4. (contextus main 4736c80)"
      - file: /home/prime/Documents/Contextus/Contextus-Spec-v1.3.md
        quote: >
          §4.6.4: "**Physical scopes** use geometric intersection: a node has
          membership iff its `Locale` (or `LocaleBounds` if it has spatial extent)
          intersects the scope's `geometry` and its timestamp falls within
          `temporal_range`." (contextus main 4736c80)
    notes: >
      The three scope kinds share one architectural role (queryable subgraph
      definition; hierarchical containment via parent_scope_id; multiplicative
      composition; anchoring retention-tier promotion) and differ only in their
      membership predicate.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: contextus:ScopeConceptual
    prefLabel: "ScopeConceptual (NT_SCOPE_CONCEPTUAL)"
    definition: >
      "a topic or domain with a name and queryable membership." Its membership
      predicate is implementation-defined per adapter (Spec v1.3 §4.6.5). A theory
      is a particular kind of conceptual scope, whose members are claims and
      observations in the derivation chain rooted at a CTH anchor.
    status: derived
    axiom_grounding: "none — Contextus spec design, an independent lineage."
    broader: []
    narrower: []
    related: [contextus:ScopePhysical, contextus:ScopeOperational, contextus:ScopeMembership, contextus:membership-predicate-catalogue, cth:Anchor]
    source:
      - file: /home/prime/Documents/Contextus/pkg/types/scope.go
        quote: "// ScopeConceptual is a topic or domain with a name and queryable membership. Spec v1.3 §4.6.3 + §11.4. (contextus main 4736c80)"
      - file: /home/prime/Documents/Contextus/doc/spec-v1.4-theory-as-conceptual-scope.md
        quote: >
          "A **theory**, for Contextus's purposes, is a particular kind of
          conceptual scope: its members are claims and observations transitively in
          the derivation chain rooted at a CTH anchor." (contextus main 4736c80)
    notes: >
      Theory and code scopes are BOTH ScopeConceptual; the attention-scalar seam
      distinguishes them by a derived domain kind, not by scope kind
      (contextus:attention-scalar-seam).
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: contextus:ScopeOperational
    prefLabel: "ScopeOperational (NT_SCOPE_OPERATIONAL)"
    definition: >
      "a hardware-instance-bounded region of the hypergraph whose members are nodes
      attributable to a named host's named hardware subsystem." The third sibling
      to ScopePhysical and ScopeConceptual; its membership predicate is
      hardware-identifier-based (exact match on host and hardware class, no
      wildcards at v0.1).
    status: derived
    axiom_grounding: "none — Contextus spec design, an independent lineage."
    broader: []
    narrower: []
    related: [contextus:ScopePhysical, contextus:ScopeConceptual, contextus:ScopeMembership, contextus:membership-predicate-catalogue, contextus:ScalarReferent]
    source:
      - file: /home/prime/Documents/Contextus/pkg/types/scope.go
        quote: >
          "// ScopeOperational is a hardware-instance-bounded region of the
          hypergraph whose members are nodes attributable to a named host's named
          hardware subsystem. See Contextus-Spec-Addendum-NT-Scope-Operational
          §§2-5." (contextus main 4736c80)
      - file: /home/prime/Documents/Contextus/Contextus-Spec-Addendum-NT-Scope-Operational.md
        quote: "§5: \"The membership predicate for `NT_SCOPE_OPERATIONAL` is hardware-identifier-based.\" (contextus main 4736c80)"
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: contextus:ScopeMembership
    prefLabel: "ScopeMembership (HE_SCOPE_MEMBERSHIP edge metadata)"
    definition: >
      "the on-edge metadata for HE_SCOPE_MEMBERSHIP": an arity-2 Wyrd hyperedge
      from a scope node to a member node, carrying since, confidence (0.0-1.0), a
      provenance_tag and the method (the membership predicate that established it).
      A member may belong to many scopes; each membership is a separate edge.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [contextus:membership-predicate-catalogue, contextus:ScopePhysical, contextus:ScopeConceptual, contextus:ScopeOperational, wyrd:Hyperedge, cth:ProvenanceKind]
    source:
      - file: /home/prime/Documents/Contextus/pkg/types/scope.go
        quote: >
          "// ScopeMembership is the on-edge metadata for HE_SCOPE_MEMBERSHIP. The
          edge itself is a Wyrd model.Hyperedge of arity 2 connecting a scope node to
          a member node. Spec v1.3 §4.6.4 + §11.4." (contextus main 4736c80)
    notes: >
      HOMONYM: provenance_tag uses Contextus's own ProvenanceTag values (P asserted /
      D inferred / T theoretical / I imported), not CTH's ProvenanceKind (see
      cth:ProvenanceKind). The Go comment on the field lists only P and D for
      memberships.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: contextus:membership-predicate-catalogue
    prefLabel: "membership-predicate catalogue (HE_SCOPE_MEMBERSHIP.method values)"
    definition: >
      The named rules by which a node becomes a member of a scope, recorded in the
      membership edge's method field. Physical scopes use geometric intersection.
      Conceptual scopes use an implementation-defined predicate; Spec v1.3 §4.6.5
      lists asserted, tag overlap, embedding similarity, classifier output and
      citation-graph proximity as non-exhaustive examples. Two canonical names are
      registered since: cth-derivation (Spec v1.4, theory-as-conceptual-scope) and
      hardware-identifier (the NT_SCOPE_OPERATIONAL addendum §5).
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [contextus:ScopeMembership, contextus:ScopePhysical, contextus:ScopeConceptual, contextus:ScopeOperational]
    source:
      - file: /home/prime/Documents/Contextus/Contextus-Spec-v1.3.md
        quote: >
          §4.6.5: "The membership predicate for conceptual scopes is deferred to the
          adapter that establishes the membership. v1.3 documents the contract; v1.x
          will document the canonical predicates as they emerge." (contextus main
          4736c80)
      - file: /home/prime/Documents/Contextus/doc/spec-v1.4-theory-as-conceptual-scope.md
        quote: >
          "§4.6.5 currently lists five non-exhaustive example methods (`asserted`,
          `tag-overlap`, `embedding-similarity`, `classifier`, `citation-graph-hop`).
          Adding a sixth: **`cth-derivation`**" (contextus main 4736c80)
      - file: /home/prime/Documents/Contextus/Contextus-Spec-Addendum-NT-Scope-Operational.md
        quote: "§5: \"The operational-scope predicate adds the canonical name `hardware-identifier` to the `HE_SCOPE_MEMBERSHIP.method` field\" (contextus main 4736c80)"
    notes: >
      The catalogue is open (non-exhaustive examples plus registered names), not a
      closed enum. SPELLING DRIFT in the source: Spec v1.3 §11.4 gives the example
      method "embedding-cosine", while §4.6.5 says "embedding similarity" and the
      v1.4 doc spells it `embedding-similarity`. No canonical spelling is recorded
      here.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: contextus:InsightSignal
    prefLabel: "InsightSignal"
    definition: >
      "the atomic unit of agent output (Theory §3.6)": a signal an agent emits about
      an anomaly it found in a subgraph, with an anomaly type and score, locale
      envelope and grain, persistence, confidence, claim history and
      tier-conditional evidence pointers. Surveillance-mode signals on operational
      scopes also carry ScalarReferents.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [contextus:ScalarReferent, contextus:RetentionTier, contextus:attention-scalar-seam]
