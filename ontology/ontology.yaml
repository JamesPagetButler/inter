      Ebbinghaus decay; revoking it lets the node resume decaying." Only an
      already-exercisable NT_CAPABILITY can mint a pin (GrantPin), and it is recorded as
      pin_grantor. The authority tier is read from the authorizing node, never from the
      caller: PinAuthorityBeekeeper gives a permanent/structural pin (no TTL);
      PinAuthoritySelf gives a bounded pin (concurrent self-pin cap + mandatory TTL). The
      decay path reads a single predicate, HGNode.PinValid(now).
    status: derived
    axiom_grounding: "none — BMA engineering implementation, an independent design lineage."
