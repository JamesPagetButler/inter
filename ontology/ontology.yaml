  - id: spike:BoundedSimulation
    prefLabel: "Bounded simulation"
    definition: >
      Circumstance-bounded forward simulation, safe because "generation is
      architecturally SEPARATED from fact-commitment, and only a
      filtered/reconciled residue crosses." Bounded by: circumstance-launch,
      narrow scope, short hop-count with explicit kill-condition,
      provenance-tagging, reconciliation.
    status: design-proposal
    axiom_grounding: none
    broader: []
    narrower: []
