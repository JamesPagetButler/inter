      A capability is a tool plus the authority to use it plus an allocated
      capacity, bound together at instantiation. The tool is the instrument
      (fed:Tool); the authority is an authority-bearing token (Edda's Cap,
      edda:Cap); the capacity is the budget allocated to that use. A bare tool
      is not a capability by itself. A skill, instantiated, still grants a
      composite capability.
