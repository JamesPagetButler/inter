    notes: "Two closed loops noted: (1) validated leaders become settled skills (today's deliberated novelty becomes tomorrow's routine); (2) ethics bounds simulation too, resolved into a separate Spike 3 (theory-of-mind, intent-as-provenance-dimension). FORMALIZED in Edda Theory Addendum A §B-§C (merged as edda#61) as the CASH leader (Cross-Axis Structural Homomorphism, the beekeeper's coinage): a leader-type whose sub-features each reflect one named invariant, I = 'no lack converts into a passing claim', via gate reflection G_A(φ(x)) ⇒ G_A(x) under conditions P1-P4. The addendum folds into Edda theory v0.3; this entry stays design-proposal."
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224686766

  - id: spike:GenerativeRatchet
    prefLabel: "Generative ratchet"
    definition: >
      "Roles are relational — an output of one step is the input or tool of
      another (Edda is an output that becomes a mechanism). Each validated new
      skill becomes a building block -> the reachable-outcome space expands ->
      the generator strengthens as the graph matures... The ratchet advances
      only on validated (settled) outputs through the oracle — so it
      accumulates truth, not activity."
    status: design-proposal
    axiom_grounding: "built on cth:decision_state's settled value as its advance-condition."
    broader: []
    narrower: []
