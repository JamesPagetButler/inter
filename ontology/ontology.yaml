    prefLabel: "Wyrd/CTH integration mapping"
    definition: "CTH's Anchor/Chain/Confluence map onto Wyrd Node/Hyperedge; CTH's Anchor.Tier is explicitly 'not the same as' Wyrd's algebraic Tier."
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [wyrd:Tier, cth:Anchor]
    source:
      - file: /home/prime/Documents/Wyrd/doc/integration/cth.md
        quote: "Anchor/Chain/Confluence -> Node/Hyperedge mapping; Tier naming-collision disclaimer"
    notes: "No occurrence of 'AXIOM-1' anywhere in the Wyrd corpus itself (confirmed via grep across all .go/.md/.lean files by the harvesting pass) — Wyrd cites inter/theory/ (Verðandi Authority Theory v0.2, BMA Theory v3.0) as its own governing anchors, not CTH roots directly."

