        quote: "'Skill & Step anatomy' section, lines 65-72 (verified directly 2026-09-27)"
      - file: /home/prime/Documents/Edda/doc/stage1a-e5.4-icom-vessel-spec.md
        quote: "ICOM = Input=tails, Control=control, Output=heads, Mechanism=mechanism. transit stays DISTINCT ... Exactly one [vessel] per skill ... EDDA-TYPE-012 — incomplete-skill-anatomy"
    notes: >
      RECORD.md is explicit that "this decomposition is genuinely new — no
      ICOM vocabulary exists in the corpus" prior to this spike. Filed here as
      design-proposal, not retroactively presented as established BMA/Wyrd
      vocabulary. REALIZED in Edda E5.4 (edda#59, merged): Control and Mechanism are
      non-mass-bearing op roles, distinct from Transit (catalyst); each skill has exactly
      one bound Vessel; anatomy completeness is enforced structurally by VerifyAnatomy
      (missing/duplicate vessel or a no-dataflow op → EDDA-TYPE-012), with no serializer.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224686895

  - id: spike:HeldVsConsumed
    prefLabel: "Held vs. consumed resources"
    definition: "\"The vessel is borrowed (reusable capability, returned); consumables are consumed (linear capability, spent) — maps to Edda's reusable-vs-linear caps.\""
    status: design-proposal
    axiom_grounding: none
