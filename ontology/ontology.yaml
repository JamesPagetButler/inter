  - id: fed:Capability
    prefLabel: "Capability (RESOLVED 2026-09-27: tool = primitive capability)"
    definition: >
      TWO ATTESTED, INCOMPATIBLE SENSES IN ACTIVE USE:
      (1) BMA/Systema/Edda sense — capability = tool, a raw/primitive ability
      held (fed:FourLayerRegistry layer 1: "Tools: Raw capabilities"; Edda's
      Cap is this same primitive-resource sense). (2) Hypergraph-generativity
      spike sense — capability = what a skill grants when instantiated (a
      composite, exercisable power produced by running a skill).
      RESOLVED 2026-09-27 (beekeeper): tool = primitive capability; a skill,
      instantiated, grants a composite capability.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: [fed:Tool, edda:Cap]
    related: [fed:FourLayerRegistry, spike:Leader, spike:GenerativeRatchet]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: >
          line 18: "'capability' is overloaded — BMA/Systema capability ≡ tool
          (a raw ability held); this design capability = what a skill grants.
          Reconciliation adopted (flagged for beekeeper ratification): a tool
          is a primitive capability; a skill, instantiated, grants a composite
          capability."
    notes: >
      RATIFIED 2026-09-27 by the beekeeper: **tool = primitive capability; a
      skill, instantiated, grants a composite capability.** The clash is
      resolved — both senses coexist under this reconciliation (tool = the
      primitive held ability; skill-granted = the composite exercisable power).
      Documents may still name which sense they mean for clarity, but this is
      no longer an open decision.

