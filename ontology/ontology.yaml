        quote: "'The generative ratchet' paragraph, line 74 (verified directly 2026-09-27)"
    notes: >
      NAMING CORRECTION for this task's own directive: the task brief asked
      for "the capability ratchet" — that exact phrase is NOT attested in the
      corpus. The real, sourced term is "generative ratchet." Recorded here
      under its actual name with the correction noted, rather than silently
      renaming the corpus to match the brief.

  - id: spike:ICOMVessel
    prefLabel: "ICOM + Vessel step anatomy"
    definition: >
      A skill is Input -> Transformation -> Output; Transformation decomposes
      into ICOM (IDEF0) plus a Vessel: "Input (subject transformed) · Control
      (the controller — human or the graph — plus setpoints/tolerances) ·
      Output · Mechanism (the effector/tool) · Vessel (what holds the subject
      during the transform — beaker / memory-cell / test-tube)." "The
      mechanism is itself a skill with its own inputs -> input accounting
      recurses... giving a complete BOM/cost."
    status: design-proposal
    axiom_grounding: none
    broader: [spike:Leader]
    narrower: [spike:HeldVsConsumed, spike:ByproductConservation]
    related: [fed:Skill]
    source:
