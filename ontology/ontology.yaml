      GENUINE CHAIN to cth:AXIOM-1: AXIOM-1's statement explicitly "selects
      division algebras (no zero divisors)". ℂ, ℍ, 𝕆 are division algebras
      (no zero divisors); 𝕊 (sedenions) is NOT — it has zero divisors (per
      AXIOM-1's own kill_condition, PROOF-42zd asserts 42 of them). So the tier
      boundary at 𝕆→𝕊 is precisely where AXIOM-1's selection clause would bite
      if its scope is unrestricted — which is AXIOM-1's own still-OPEN
      QUESTION 2. This ontology inherits that open-ness: the tier tower's
      privileged-vs-not boundary is grounded in AXIOM-1, but AXIOM-1 itself has
