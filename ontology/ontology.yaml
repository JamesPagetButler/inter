    notes: "Distinct concept/term from cth:Anchor (CTH's proof-ledger record) — both use 'anchor' but for different things across projects; worth flagging as a second minor naming overlap alongside the Tier collision."

  - id: systema:VigilanceBackflow
    prefLabel: "Vigilance backflow"
    definition: >
      "The pipeline flows in both directions... Backward flow carries two
      distinct signals: vigilance (something went wrong) and challenge
      identification (something needs doing)." "When harm or failure occurs in
      the world, the signal propagates upstream to the appropriate level" —
      Reference Design (manufacturing defect) -> Spec (design flaw) -> Theory
      (theory error) -> Trust Anchors (anchor failure, "halt everything").
      Severity-dependent reach with corresponding actions (review, hold,
      recall, halt).
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:TrustAnchor, systema:TheoryEngineeringCarts]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-v08-addendum.md
        quote: "§5.1-5.2, lines 385-433 (verified directly 2026-09-27)"
    notes: "Distinct from 'challenge identification' backflow — two separate backward signals per the same section."

  - id: systema:OKHDomainTaxonomy
    prefLabel: "OKH domain taxonomy"
    definition: >
      Five domains classifying OKH manifests by deliverable: Hardware
      (physical artefact, atomic), Software (code that runs, atomic), Process
      (a procedure, atomic), Biological (living-system interventions, atomic),
      System (composition of OKH manifests from any domain, compositional).
      "Hybrid" explicitly rejected as a domain: "A project that combines
      software and hardware... is a system whose sub-components span the
      software and hardware domains."
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:ThreeLoopModel]
    source:
      - file: /home/prime/Documents/Systema/okh-domains/DOMAINS.md
        quote: "full file, verified directly 2026-09-27"
    notes: "Each domain has characteristic Loop1/2/3 standards (e.g. Software: coding standards -> architecture review -> formal verification/pen-testing/code audit)."

  # ==========================================================================
  # SPIKE — hypergraph-generativity spike (2026-09-25). ALL entries here are
  # DESIGN-PROPOSAL / DRAFT. Explicitly NOT ratified — quoting RECORD.md:
  # "a design record for review, not a ratified spec and not a run."
  # ==========================================================================

  - id: spike:ActiveMode
    prefLabel: "Active mode"
    definition: >
      "Operating entirely within the existing model of the circumstance,
      executing known patterns/skills directly from settled structure — no
      simulation, no conceptualization, no open quarantine. Match a settled
      pattern, act. It is the default and by far the cheapest path." Escalates
      to napkin only "when the known patterns fail."
    status: design-proposal
    axiom_grounding: none
    broader: []
    narrower: []
    related: [spike:FormalityGradient, spike:Leader]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'The gradient's floor' section, lines 42-50 (verified directly 2026-09-27)"
    notes: "Grounded in cited cognitive-science literature (Rasmussen's SRK ladder, Kahneman System 1, Dreyfus expert fluidity, predictive-processing low-prediction-error steady-state) — those citations are the spike's own, not independently re-verified here."

  - id: spike:BoundedSimulation
    prefLabel: "Bounded simulation"
    definition: >
      Circumstance-bounded forward simulation, safe because "generation is
      architecturally SEPARATED from fact-commitment, and only a
      filtered/reconciled residue crosses." Bounded by: circumstance-launch,
      narrow scope, short hop-count with explicit kill-condition,
      provenance-tagging, reconciliation.
    status: design-proposal
    axiom_grounding: none
    broader: []
    narrower: []
    related: [spike:ActiveMode, spike:ProductProjectionProvenance]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "Thesis section, line 7 (verified directly 2026-09-27)"
    notes: "The load-bearing safety claim: 'biological generativity is safe not because it is accurate, but because generation is architecturally separated from fact-commitment.'"

  - id: spike:ProductProjectionProvenance
    prefLabel: "(Product, Projection, Provenance) output triple"
    definition: >
      "A bounded simulation does not output language. It outputs a (Product,
      Projection, Provenance) triple: Product (P) — the domain-typed substrate
      structure the simulation produced... PRIMARY, lives in the substrate.
      Projection (L) — a rendering of P into a target-legible form... L must
      be dual — both human-readable AND computer-readable... L is derived FROM
      P, never an independent output. Provenance (V) — NOT a binary
      open/settled flag but a formality-graded quality state... carried by
      CTH's anchor kinds (CONJ-/DERIV-/PROOF-), ProofState, and closure."
    status: design-proposal
    axiom_grounding: "none direct, but explicitly built ON cth:ProofState and cth:closure as its Provenance mechanism — those are derived/canonical; the triple itself as a design pattern is design-proposal."
    broader: []
    narrower: []
    related: [cth:ProofState, cth:closure, spike:FormalityGradient]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'The output model' section, lines 20-28 (verified directly 2026-09-27)"
    notes: >
      This is the SAME dual-readability requirement (L must be human AND
      machine readable) this ontology itself is built to satisfy — the
      ontology dogfoods this pattern, not just AXIOM-1's provenance discipline.
      Also NOTE: this section calls L "a projection functor" — see the naming
      correction under edda:Project (the term "functor" is not attested for
      Wyrd's actual π projection; the spike's usage here is looser/informal).

  - id: spike:FormalityGradient
    prefLabel: "Formality gradient (active -> napkin -> engineering -> formal)"
    definition: >
      "The formality gradient runs napkin/back-of-envelope -> engineering ->
      formal/theory." Napkin = minimal oracle, loose is fine because tagged
      low-formality. Engineering = schema-validation, buildability, constraint
      satisfaction. Formal = proven (closure: derivation) or validated against
      experimental data (closure: measurement). Below napkin sits active mode
      (see spike:ActiveMode). "The declared formality tier MUST match the
      oracle that was cleared... claiming a higher formality than the oracle
      actually passed is the laundering failure."
    status: design-proposal
    axiom_grounding: "built on cth:closure and cth:ProofState (derived/canonical) as its formal-tier mechanism."
    broader: []
    narrower: [spike:ActiveMode]
    related: [cth:closure, cth:ProofState, cth:four-bucket-audit]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'Good-quality output' section, lines 30-40 (verified directly 2026-09-27)"
    notes: "Explicitly parallels CTH's own anti-laundering rule (S3), generalized here from claims to simulated-output formality."

  - id: spike:Leader
    prefLabel: "Leader (chain of skills)"
    definition: >
      "A leader (cth-implementor's sense) is a chain / path from a
      circumstance to an intended outcome. Goal-directed action = compose a
      chain of skills/known tools toward the outcome, guided by wisdoms,
      bounded by ethics." Four layers: Skills/tools (object-level) -> Leader/
      chain (the path) -> Wisdoms (meta-guidance, does not execute) -> Ethics/
      morals (outer envelope, hard constraint on which chains may be
      constructed at all).
    status: design-proposal
    axiom_grounding: none
    broader: []
    narrower: []
    related: [fed:Skill, fed:Wisdom, wyrd:Hyperedge, spike:GenerativeRatchet]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'The control structure' section, lines 52-63 (verified directly 2026-09-27)"
    notes: "Two closed loops noted: (1) validated leaders become settled skills (today's deliberated novelty becomes tomorrow's routine); (2) ethics bounds simulation too, resolved into a separate Spike 3 (theory-of-mind, intent-as-provenance-dimension)."

  - id: spike:GenerativeRatchet
    prefLabel: "Generative ratchet"
    definition: >
      "Roles are relational — an output of one step is the input or tool of
      another (Edda is an output that becomes a mechanism). Each validated new
      skill becomes a building block -> the reachable-outcome space expands ->
      the generator strengthens as the graph matures... The ratchet advances
      only on validated (settled) outputs through the oracle — so it
      accumulates truth, not activity."
    status: design-proposal
    axiom_grounding: "built on cth:decision_state's settled value as its advance-condition."
    broader: []
    narrower: []
    related: [spike:Leader, fed:Capability]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'The generative ratchet' paragraph, line 74 (verified directly 2026-09-27)"
    notes: >
      NAMING CORRECTION for this task's own directive: the task brief asked
      for "the capability ratchet" — that exact phrase is NOT attested in the
      corpus. The real, sourced term is "generative ratchet." Recorded here
      under its actual name with the correction noted, rather than silently
      renaming the corpus to match the brief.

  - id: spike:ICOMVessel
    prefLabel: "ICOM + Vessel step anatomy"
    definition: >
      A skill is Input -> Transformation -> Output; Transformation decomposes
      into ICOM (IDEF0) plus a Vessel: "Input (subject transformed) · Control
      (the controller — human or the graph — plus setpoints/tolerances) ·
      Output · Mechanism (the effector/tool) · Vessel (what holds the subject
      during the transform — beaker / memory-cell / test-tube)." "The
      mechanism is itself a skill with its own inputs -> input accounting
      recurses... giving a complete BOM/cost."
    status: design-proposal
    axiom_grounding: none
    broader: [spike:Leader]
    narrower: [spike:HeldVsConsumed, spike:ByproductConservation]
    related: [fed:Skill]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'Skill & Step anatomy' section, lines 65-72 (verified directly 2026-09-27)"
    notes: >
      RECORD.md is explicit that "this decomposition is genuinely new — no
      ICOM vocabulary exists in the corpus" prior to this spike. Filed here as
      design-proposal, not retroactively presented as established BMA/Wyrd
      vocabulary.

  - id: spike:HeldVsConsumed
    prefLabel: "Held vs. consumed resources"
    definition: "\"The vessel is borrowed (reusable capability, returned); consumables are consumed (linear capability, spent) — maps to Edda's reusable-vs-linear caps.\""
    status: design-proposal
    axiom_grounding: none
    broader: [spike:ICOMVessel]
    narrower: []
    related: [edda:Cap]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
