          v1.3 §11.1. // Tier-conditional field population is enforced by the
          retention layer at write time, not by this struct." (contextus main
          4736c80)
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: contextus:ScalarReferent
    prefLabel: "ScalarReferent"
    definition: >
      "a predicted-vs-observed scalar value pair and a divergence score for a named
      surveillance target on an operational scope": label, predicted, observed, a
      normalised divergence score in [0.0, 1.0], and the operational scope it
      tracks. It carries the summary tuple only, not the raw time-series.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [contextus:InsightSignal, contextus:ScopeOperational, contextus:attention-scalar-seam]
    source:
      - file: /home/prime/Documents/Contextus/pkg/types/signal.go
        quote: >
          "// ScalarReferent records a predicted-vs-observed scalar value pair and a
          divergence score for a named surveillance target on an operational scope.
          Spec v1.4 §2.4." (contextus main 4736c80)
    notes: >
      Score computation is Contextus-side; CTH's ScorePrediction is a separate
      scoring surface, and any coupling is Walk-phase (signal.go ownership note). The
      attention-scalar seam's v0.1 trajectory additions to ScalarReferent are
      contract-only and not yet in the Go type.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: contextus:RetentionTier
    prefLabel: "Retention tier (Core / Near / Peripheral / Distant / Skeleton)"
    definition: >
      A tier of Proportional Data Retention, where "storage cost per item is
      proportional to epistemic proximity to active research flows": Core (full
      text, parsed claims, ...; ~500 KB-2 MB), Near (~10-50 KB), Peripheral (~1-5
      KB), Distant (~200-500 bytes) and Skeleton (DOI and publication year only;
      ~50-100 bytes). Co-activation promotes; Ebbinghaus decay demotes; Skeleton
      entries are never deleted.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [fed:Tier, contextus:InsightSignal, contextus:ScopeMembership]
    source:
      - file: /home/prime/Documents/Contextus/Contextus-Spec-v1.3.md
        quote: >
          "## 9. Proportional Data Retention ... storage cost per item is
          proportional to epistemic proximity to active research flows." §9.1
          Retention Tiers table: Core / Near / Peripheral / Distant / Skeleton
          (contextus main 4736c80)
      - file: /home/prime/Documents/Contextus/README.md
        quote: "\"Spec §9 (Proportional Data Retention) tiers signals from Core (full content, 500 KB–2 MB) down through Skeleton (DOI + year, 50–100 bytes).\" (contextus main 4736c80)"
    notes: >
      Split out of wyrd:Tier's v0.3.0 sense list per the 2026-10-22 beekeeper ruling
      (inter#173); v0.3.0 named only Core and Skeleton, the full five-tier list is
      from Spec v1.3 §9.1. Activating a scope promotes its member signals toward
      Core (Spec v1.3 §4.6.6).
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

