          authority to use it + allocated capacity, bound at instantiation. A
          skill, instantiated, still grants a composite capability. This refines
          the 2026-09-27 ruling ("tool = primitive capability"): a bare tool is
          no longer a capability by itself. It merges Bragi's reading
