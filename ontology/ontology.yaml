        quote: "Thesis section, line 7 (verified directly 2026-09-27)"
    notes: "The load-bearing safety claim: 'biological generativity is safe not because it is accurate, but because generation is architecturally separated from fact-commitment.'"

  - id: spike:ProductProjectionProvenance
    prefLabel: "(Product, Projection, Provenance) output triple"
    definition: >
      "A bounded simulation does not output language. It outputs a (Product,
      Projection, Provenance) triple: Product (P) — the domain-typed substrate
      structure the simulation produced... PRIMARY, lives in the substrate.
      Projection (L) — a rendering of P into a target-legible form... L must
      be dual — both human-readable AND computer-readable... L is derived FROM
      P, never an independent output. Provenance (V) — NOT a binary
      open/settled flag but a formality-graded quality state... carried by
      CTH's anchor kinds (CONJ-/DERIV-/PROOF-), ProofState, and closure."
    status: design-proposal
    axiom_grounding: "none direct, but explicitly built ON cth:ProofState and cth:closure as its Provenance mechanism — those are derived/canonical; the triple itself as a design pattern is design-proposal."
    broader: []
    narrower: []
    related: [cth:ProofState, cth:closure, spike:FormalityGradient]
    source:
