  - id: spike:ActiveMode
    prefLabel: "Active mode"
    definition: >
      "Operating entirely within the existing model of the circumstance,
      executing known patterns/skills directly from settled structure — no
      simulation, no conceptualization, no open quarantine. Match a settled
      pattern, act. It is the default and by far the cheapest path." Escalates
      to napkin only "when the known patterns fail."
    status: design-proposal
    axiom_grounding: none
    broader: []
    narrower: []
    related: [spike:FormalityGradient, spike:Leader]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'The gradient's floor' section, lines 42-50 (verified directly 2026-09-27)"
    notes: "Grounded in cited cognitive-science literature (Rasmussen's SRK ladder, Kahneman System 1, Dreyfus expert fluidity, predictive-processing low-prediction-error steady-state) — those citations are the spike's own, not independently re-verified here."

  - id: spike:BoundedSimulation
    prefLabel: "Bounded simulation"
    definition: >
      Circumstance-bounded forward simulation, safe because "generation is
      architecturally SEPARATED from fact-commitment, and only a
      filtered/reconciled residue crosses." Bounded by: circumstance-launch,
      narrow scope, short hop-count with explicit kill-condition,
      provenance-tagging, reconciliation.
    status: design-proposal
    axiom_grounding: none
    broader: []
    narrower: []
    related: [spike:ActiveMode, spike:ProductProjectionProvenance]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "Thesis section, line 7 (verified directly 2026-09-27)"
    notes: "The load-bearing safety claim: 'biological generativity is safe not because it is accurate, but because generation is architecturally separated from fact-commitment.'"

  - id: spike:ProductProjectionProvenance
    prefLabel: "(Product, Projection, Provenance) output triple"
    definition: >
      "A bounded simulation does not output language. It outputs a (Product,
      Projection, Provenance) triple: Product (P) — the domain-typed substrate
      structure the simulation produced... PRIMARY, lives in the substrate.
      Projection (L) — a rendering of P into a target-legible form... L must
      be dual — both human-readable AND computer-readable... L is derived FROM
      P, never an independent output. Provenance (V) — NOT a binary
      open/settled flag but a formality-graded quality state... carried by
      CTH's anchor kinds (CONJ-/DERIV-/PROOF-), ProofState, and closure."
    status: design-proposal
    axiom_grounding: "none direct, but explicitly built ON cth:ProofState and cth:closure as its Provenance mechanism — those are derived/canonical; the triple itself as a design pattern is design-proposal."
    broader: []
    narrower: []
    related: [cth:ProofState, cth:closure, spike:FormalityGradient]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'The output model' section, lines 20-28 (verified directly 2026-09-27)"
    notes: >
      This is the SAME dual-readability requirement (L must be human AND
      machine readable) this ontology itself is built to satisfy — the
      ontology dogfoods this pattern, not just AXIOM-1's provenance discipline.
      Also NOTE: this section calls L "a projection functor" — see the naming
      correction under edda:Project (the term "functor" is not attested for
      Wyrd's actual π projection; the spike's usage here is looser/informal).

  - id: spike:FormalityGradient
    prefLabel: "Formality gradient (active -> napkin -> engineering -> formal)"
    definition: >
      "The formality gradient runs napkin/back-of-envelope -> engineering ->
      formal/theory." Napkin = minimal oracle, loose is fine because tagged
      low-formality. Engineering = schema-validation, buildability, constraint
      satisfaction. Formal = proven (closure: derivation) or validated against
      experimental data (closure: measurement). Below napkin sits active mode
      (see spike:ActiveMode). "The declared formality tier MUST match the
      oracle that was cleared... claiming a higher formality than the oracle
      actually passed is the laundering failure."
    status: design-proposal
    axiom_grounding: "built on cth:closure and cth:ProofState (derived/canonical) as its formal-tier mechanism."
    broader: []
    narrower: [spike:ActiveMode]
    related: [cth:closure, cth:ProofState, cth:four-bucket-audit]
    source:
      - file: /home/prime/Documents/inter/worktrees/hypergraph-generativity/spikes/2026-09-25-hypergraph-bounded-generativity/RECORD.md
        quote: "'Good-quality output' section, lines 30-40 (verified directly 2026-09-27)"
      - file: /home/prime/Documents/Edda/doc/stage1a-e3-formality-spec.md
        quote: "Formality is a NEW orthogonal axis — napkin < engineering < formal ... MIN-over-chain composition = lattice meet ... LITERALS DEFAULT TO formal (TOP)"
    notes: >
      Explicitly parallels CTH's own anti-laundering rule (S3), generalized here from
      claims to simulated-output formality. REALIZED in Edda E3 (edda#49, merged): a
      value-level graded type napkin < engineering < formal, composed MIN-over-chain
      (lattice meet), with literals defaulting to formal (top) and an overclaim rejected
      as EDDA-TYPE-008. The Edda type covers napkin..formal; the spike's active mode sits
      below it. The spike term itself stays design-proposal.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224687009

  - id: spike:Leader
    prefLabel: "Leader (chain of skills)"
    definition: >
      "A leader (cth-implementor's sense) is a chain / path from a
      circumstance to an intended outcome. Goal-directed action = compose a
      chain of skills/known tools toward the outcome, guided by wisdoms,
      bounded by ethics." Four layers: Skills/tools (object-level) -> Leader/
      chain (the path) -> Wisdoms (meta-guidance, does not execute) -> Ethics/
      morals (outer envelope, hard constraint on which chains may be
      constructed at all).
    status: design-proposal
    axiom_grounding: none
    broader: []
    narrower: []
    related: [fed:Skill, fed:Wisdom, wyrd:Hyperedge, spike:GenerativeRatchet]
