        quote: >
          line 18: "'capability' is overloaded — BMA/Systema capability ≡ tool
          (a raw ability held); this design capability = what a skill grants.
          Reconciliation adopted (flagged for beekeeper ratification): a tool
          is a primitive capability; a skill, instantiated, grants a composite
          capability."
    notes: >
      RATIFIED 2026-09-27 by the beekeeper: **tool = primitive capability; a
      skill, instantiated, grants a composite capability.** The clash is
      resolved — both senses coexist under this reconciliation (tool = the
      primitive held ability; skill-granted = the composite exercisable power).
      Documents may still name which sense they mean for clarity, but this is
      no longer an open decision.

  # ==========================================================================
  # FED — forging & weaving (federation process vocabulary). Ratified 2026-10-08:
  # inter#160 → #165 (reconciliation), inter#161 r2 → #166 (weave orientation).
  # ==========================================================================

  - id: fed:forging
    prefLabel: "forging"
    definition: >
      The method: a chain of retained, risk-ordered strikes that de-risks and builds a capability; repo-agnostic. Forging says how an increment is made and hardened; weaving (§1b) says its topology.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: [fed:strike]
    related: [fed:thread, fed:fabric, fed:executable-specification]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          "Forging is how we build something durable and de-risked: a sequence of strikes (thin, end-to-end increments) that are kept and grown, each advancing only when its executable specification is green."
    notes: >
      RATIFIED 2026-09-27 (inter#135); reconciled 2026-10-08 (inter#160/#165). Cross-repo 'Damascus melding' is the common case, not a second definition.

  - id: fed:thread
    prefLabel: "thread (weft)"
    definition: >
      The ephemeral, parallel conceptual-development unit within a sprint, where intent, theory and per-repo spec-deltas are spelled out and where spikes run; converts into one or more strikes once its executable specification is fully defined. Two kinds: warp thread (one repo) and weft thread (cross-repo). 'Weft' is this same concept named for its cross-repo orientation (weft ≡ thread).
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: []
    related: [fed:strike, fed:spike, fed:warp, fed:crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1a: "A thread is the ephemeral conceptual-development unit within a sprint." §1b: "Weft ≡ thread (§1a): one concept, one definition."
    notes: >
      RATIFIED 2026-10-08 (inter#160 → #165; weave orientation inter#161 r2 → #166). Deliberately ONE entry: 'weft' is an alias, not a separate term (deming refinement R3), so the two names cannot drift apart.

  - id: fed:strike
    prefLabel: "strike"
    definition: >
      One retained increment of forging. Entry: its executable specification is fully defined. Exit (lands): that executable specification is green, not when its build merges (Governing Principle 2). Kinds: warp strike (repo-local) and weft strike / pick (cross-repo, lands on its meta-lock).
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:forging]
    narrower: [fed:pick]
    related: [fed:executable-specification, fed:meta-lock, fed:thread]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          "Governing principle 2: a strike is not done when its build merges — it is done when its executable specification is green."

  - id: fed:spike
    prefLabel: "spike (forging sense)"
    definition: >
      A time-boxed, disposable probe that answers an explicit question and outputs a capability-gap list; runs in the thread phase, before a strike is defined. Distinct from the `spike:` namespace, which holds terms from one specific spike (hypergraph generativity).
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: []
    related: [fed:thread, fed:strike]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §3: "A spike is a time-boxed, exploratory investigation to reduce uncertainty. Its product is knowledge, not shipped software."
    notes: >
      Disambiguation: `fed:spike` = the method's probe; `spike:*` = vocabulary harvested from the 2026-09-25 hypergraph-generativity spike.

  - id: fed:executable-specification
    prefLabel: "executable specification"
    definition: >
      The CI-gated oracle a strike lands against: one assertion per finding, retained permanently as a regression guard. Historical aliases: 'lock', 'edda-lock'.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: [fed:meta-lock]
    related: [fed:strike, fed:crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §4: "An executable specification is a CI-gated test-set with one assertion per finding the spike raised, retained permanently and run as a regression guard"

  - id: fed:meta-lock
    prefLabel: "meta-lock"
    definition: >
      The aggregate of a cross-repo strike's per-repo locks; it IS that strike's executable specification, not a separate gate. The strike lands only when every per-repo lock is green.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:executable-specification]
    narrower: []
    related: [fed:pick, fed:crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §4: "a cross-repo strike's executable specification is the meta-lock, the aggregate of its per-repo locks."

  - id: fed:warp
    prefLabel: "warp"
    definition: >
      A repo's own lengthwise progression (spec, backlog, roadmap). A seat tends exactly one warp, its write axis (Seat Charter R1); everything else it touches is a crossing or a read.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: []
    related: [fed:thread, fed:crossing, fed:float]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "A seat tends exactly one warp, its write axis (Seat Charter R1). Everything else it touches is a crossing or a read."

  - id: fed:crossing
    prefLabel: "crossing"
    definition: >
      Where a weft or a consumer meets another warp: a per-repo spec-delta proven by that repo's lock. Requires a bidirectional link across the strike or seam record, the issue on the crossed repo, and the lock's verification handle.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: [fed:standing-crossing]
    related: [fed:warp, fed:thread, fed:meta-lock, fed:float]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "Without links in both directions it is not a crossing."

  - id: fed:standing-crossing
    prefLabel: "standing crossing"
    definition: >
      A persistent crossing: a consumption seam where one warp continuously consumes another's output. Its lock is a handle (grade + pinned source sha + artifact tie). It carries the handle, not the upstream justification.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:crossing]
    narrower: []
    related: [fed:float, fed:fabric]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "A standing crossing carries the handle, not the upstream justification."
    notes: >
      Worked instance: qbp-compute-unit's tie to the proven Fano table (PROOF-fano-table-equals-cd-products, PA-2). See inter#162 for the QBP→qbp-systema boundary.

  - id: fed:pick
    prefLabel: "pick"
    definition: >
      One pass of a weft, i.e. one cross-repo strike; it lands on its meta-lock and is recorded in a Strike Record whose index rows are its crossings.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
