        quote: "Salience           float64  `json:\"salience\"`             // [0,1] default cone rank (craft main 3e27615)"
      - file: /home/prime/Documents/Craft/doc/design/craft-96-render-design.md
        quote: "| `salience` | **Register assignment** (foveal cone vs peripheral ring) + glyph fidelity (detail scales with salience) | canopy (in-world) | (craft main 3e27615)"
      - file: /home/prime/Documents/Contextus/doc/design/attention-scalar-wire-contract.md
        quote: "Salience           float64  `json:\"salience\"`             // [0,1] default rank = AnomalyScore (operational: MaxScore of Referents) (contextus main 4736c80)"
    notes: >
      HOMONYM of wyrd:Salience (eviction priority on a Wyrd Node, with documented
