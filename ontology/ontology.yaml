  - id: systema:TrustAnchor
    prefLabel: "Trust Anchor"
    definition: >
      "A trust anchor is an independent piece of evidence that constructively
      reinforces a pattern. When multiple anchors point to the same conclusion
      through different methods, the resulting confidence is greater than any
      single anchor could provide. This is the epistemological foundation the
      entire pipeline stands on." Self-reinforcing / constructive-interference
      property is explicit. AnchorStatus = Active/Weakened/Retracted.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:VigilanceBackflow, cth:Anchor]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-v08-addendum.md
        quote: "§1.2, lines 69-73 (verified directly 2026-09-27)"
    notes: "Distinct concept/term from cth:Anchor (CTH's proof-ledger record) — both use 'anchor' but for different things across projects; worth flagging as a second minor naming overlap alongside the Tier collision."

  - id: systema:VigilanceBackflow
    prefLabel: "Vigilance backflow"
    definition: >
      "The pipeline flows in both directions... Backward flow carries two
      distinct signals: vigilance (something went wrong) and challenge
      identification (something needs doing)." "When harm or failure occurs in
      the world, the signal propagates upstream to the appropriate level" —
      Reference Design (manufacturing defect) -> Spec (design flaw) -> Theory
      (theory error) -> Trust Anchors (anchor failure, "halt everything").
      Severity-dependent reach with corresponding actions (review, hold,
      recall, halt).
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:TrustAnchor, systema:TheoryEngineeringCarts]
    source:
      - file: /home/prime/Documents/Systema/docs/systema-v08-addendum.md
        quote: "§5.1-5.2, lines 385-433 (verified directly 2026-09-27)"
    notes: "Distinct from 'challenge identification' backflow — two separate backward signals per the same section."

  - id: systema:OKHDomainTaxonomy
    prefLabel: "OKH domain taxonomy"
    definition: >
      Five domains classifying OKH manifests by deliverable: Hardware
      (physical artefact, atomic), Software (code that runs, atomic), Process
      (a procedure, atomic), Biological (living-system interventions, atomic),
      System (composition of OKH manifests from any domain, compositional).
      "Hybrid" explicitly rejected as a domain: "A project that combines
      software and hardware... is a system whose sub-components span the
      software and hardware domains."
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [systema:ThreeLoopModel]
    source:
      - file: /home/prime/Documents/Systema/okh-domains/DOMAINS.md
        quote: "full file, verified directly 2026-09-27"
    notes: "Each domain has characteristic Loop1/2/3 standards (e.g. Software: coding standards -> architecture review -> formal verification/pen-testing/code audit)."

  # ==========================================================================
  # SPIKE — hypergraph-generativity spike (2026-09-25). ALL entries here are
