    notes: "Explicit mapping onto Edda's linear-capability semantics — this is a real cross-reference, not a coincidental term reuse."

  - id: spike:ByproductConservation
    prefLabel: "Byproducts / conservation"
    definition: >
      "'Consume' = re-type, not delete. Matter/energy is conserved; a consumed
      input transitions type to a byproduct node (low-salience) — a
      first-class unintended output. So conservation is a validity oracle for
      physical steps (mass/energy balance = a cheap graph-internal Gate-1
      check), and 'delete' is only ever a logical abstraction over
      transform-to-entropy."
    status: design-proposal
    axiom_grounding: "Notably invokes AXIOM-1's own subject matter (information/matter preservation) by analogy — but is NOT claimed by RECORD.md itself as a formal derivation from AXIOM-1, only a Landauer/information-erasure-at-𝕊 cross-reference. Do not over-read this as a proven chain."
    broader: [spike:ICOMVessel]
    narrower: []
    related: [cth:AXIOM-1]
    source:
