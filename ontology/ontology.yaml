  - id: craft:AttentionSalience
    prefLabel: "attention salience (the attention scalar's `salience`)"
    definition: >
      The [0,1] attention/render rank of a signal on the attention-scalar seam:
      the "default cone rank" that assigns the signal's register (foveal cone vs
      peripheral ring) and its glyph fidelity. Emit-side default is the signal's
      AnomalyScore (for operational signals, the MaxScore of its Referents).
    status: derived
    axiom_grounding: none
    broader: [contextus:attention-scalar-seam]
    narrower: []
    related: [wyrd:Salience]
    source:
