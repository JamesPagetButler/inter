%YAML 1.1
---
# ============================================================================
# FEDERATION ONTOLOGY — machine-readable core (DRAFT v0.4.0)
# ============================================================================
# Human AND machine entry point. Read top to bottom as prose, or parse as YAML.
# See ../README.md for the guided tour and ../ONTOLOGY-BEST-PRACTICES.md for
# why this format was chosen and how it upgrades to SKOS/JSON-LD later.
#
# STATUS OF THIS FILE: DRAFT. First cut of the CORE current vocabulary, not the
# whole federation. Every term below was harvested and verified against a
# committed source file (quoted or tightly paraphrased) — nothing here was
# invented. Where a term could not be located, it is marked status: unlocated
# rather than guessed. Where the corpus itself flags a term as unverified,
# unratified, or contested, that status is carried forward, not smoothed over.
# ============================================================================

_meta:
  title: "Federation Ontology (DRAFT)"
  status: DRAFT
  version: "0.4.0"
  date: "2026-10-22"
  root_axiom: cth:AXIOM-1
  scope: >
    Core vocabulary in current active use across CTH, Wyrd, BMA, Edda, Systema,
    and the hypergraph-generativity spike, plus the cross-cutting "capability"
    clash. Not exhaustive — see README.md "Extension path" for how to add terms.

  field_glossary:
    id: "Stable namespaced identifier, e.g. cth:AXIOM-1. Namespace = source project."
    prefLabel: "Human-readable label. Maps to skos:prefLabel."
    definition: "Human-readable definition, quoted or tightly paraphrased from a committed source. Maps to skos:definition."
    status: >
      This ontology's own formality/provenance tag (dogfoods the federation's own
      provenance discipline — see CTH ProofState/closure). One of:
        axiom          - a root axiom itself (only cth:AXIOM-1 in this draft)
        derived        - established in a ratified spec, proven code/Lean, or a
                         committed schema; may or may not trace formally to AXIOM-1
                         (see axiom_grounding for that distinction)
        conjectural    - the SOURCE ITSELF flags this as unverified/theoretical
        design-proposal - draft/unratified design work, not yet beekeeper-ratified
        unlocated      - searched for in the corpus, not found; flagged, not guessed
    axiom_grounding: >
      Either a derivation chain of term ids ending in cth:AXIOM-1 (for the small
      number of terms that genuinely trace to it mathematically), or an explicit
      note that no such chain exists and the term belongs to an independent design
      lineage (BMA Theory, Systema spec, Edda language design, or plain engineering
      convention). Most terms are honestly the latter — see README.md for why this
      ontology does not force false derivation chains.
    broader: "List of term ids this term is a kind of. Maps to skos:broader."
    narrower: "List of term ids that are kinds of this term. Maps to skos:narrower."
    related: "List of term ids this term relates to without being a kind of. Maps to skos:related."
    source: "List of {file: <absolute path>, quote: <verbatim or tight paraphrase>}."
    notes: "Discrepancies, gaps, corrections, or BEEKEEPER-DECISION flags."
    review_ref: "Optional. List of review-comment URLs (html_url) whose finding changed or confirmed this entry. Added in v0.3.0 for the inter#164 federation review harvest; every changed entry carries one."

  namespaces:
    cth: "Confluent Trust Hypergraph — schema $defs canonical in confluent-trust schema/inventory.schema.json; ledger data in the QBP corpus (the axiom/proof ledger)"
    wyrd: "Wyrd — quaternion-native typed holographic hypergraph DB"
    bma: "BMA — Biological Mind Architecture"
    edda: "Edda — theory-to-executable compiler/language"
    systema: "Systema — workspace process framework"
    spike: "hypergraph-generativity spike (2026-09-25) — DRAFT, NOT ratified"
    fed: "cross-cutting federation-level terms (registry layers, capability, the Tier sense index)"
    notary: "Notary — the federation verification-and-validation function (Trust Tiers, verification outcomes, PA-record vocabulary). Owner seat: notary-implementor. Private repo: vocabulary only, no internal mechanics (beekeeper ruling, inter#173)."
    contextus: "Contextus — ecosystem insight discovery (scope nodes, scope membership, insight signals, retention tiers, the emit side of the attention-scalar seam). Owner seat: contextus-impl."
    craft: "Craft — the cockpit that renders the attention scalar (render side of the craft/Contextus seam). Owner seat: hutchins. Private repo: vocabulary only, no internal mechanics (beekeeper ruling, inter#173)."

  change_history:
    "0.4.0": >
      2026-10-22. Applies the four beekeeper rulings recorded on inter#173
      (https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133):
      (1) fed:Capability becomes the bound triple tool + authority + allocated
      capacity, with fed:Tool the instrument (refines the 2026-09-27 ruling);
      (2) Tier split into one concept id per sense, with fed:Tier as a
      disambiguation index; (3) notary:, contextus: and craft: namespaces added,
      each term source-verified on its owner repo's default branch; (4)
      cth:belief-tiers mapped to notary:TrustTier x PA grade, unlocated -> derived,
      pending @cth-implementor's co-sign. 72 -> 92 terms (20 new).
    "0.3.0": "2026-10-09. inter#164 federation review harvest; review_ref field introduced. 68 -> 72 terms."

  format_mapping_to_skos_jsonld:
    id: "@id"
    prefLabel: "skos:prefLabel"
    definition: "skos:definition"
    broader: "skos:broader"
    narrower: "skos:narrower"
    related: "skos:related"
    note: "See ONTOLOGY-BEST-PRACTICES.md §5 for the full upgrade-path table."

terms:

  # ==========================================================================
  # CTH — the axiom/proof ledger. cth:AXIOM-1 is this ontology's root.
  # ==========================================================================

  - id: cth:AXIOM-1
    prefLabel: "AXIOM-1 — Information is preserved"
    definition: >
      "No physical process destroys information. Selects division algebras
      (no zero divisors: ab=0 implies a=0 or b=0)."
    status: axiom
    axiom_grounding: >
      IS the root axiom — this ontology's grounding point for everything tagged
      axiom_grounding below. Note carefully: AXIOM-1's own decision_state is
      "open", not "settled" (see notes) — it is asserted and load-bearing, but
      not yet closed by the CTH ledger's own rules. Anything whose grounding
      chain passes through AXIOM-1 inherits that open-ness honestly.
    broader: []
    narrower: [cth:ROOT-Prefix-Taxonomy]
    related: [cth:decision_state, cth:kill_condition, cth:closure, cth:four-bucket-audit, wyrd:Tier, edda:BornRule]
    source:
      - file: /home/prime/Documents/QBP-implementor/archive/cth-inventory/confluent-trust-inventory-v5_3.v0.3.json
        quote: >
          {"id": "AXIOM-1", "name": "Information is preserved", "statement":
          "No physical process destroys information. Selects division algebras
          (no zero divisors: ab=0 implies a=0 or b=0).", "derivable": false,
          "decision_state": "open"}
      - file: /home/prime/Documents/QBP-implementor/scripts/root_audit.py
        quote: "DEFAULT_LEDGER points at this same file — confirms it is the live canonical ledger, not a superseded snapshot."
    notes: >
      CANONICAL location confirmed directly (not just via subagent report) on
      2026-09-27 by reading the JSON record. Two live kill_condition entries on
      AXIOM-1 itself: (1) QUESTION 1 — whether "physical process" ranges over the
      whole substrate or only crystal-internal processes (closure: derivation,
      discharge: FLAG-rule-flow-open, trigger issue #647) — TODAY: "no proven
      flow exists... recorded as OPEN, not as a pass"; (2) QUESTION 2 — scope of
      the "selects division algebras" clause: encoding-only vs. unrestricted
      (closure: ruling-rescope) — PROOF-42zd's 42 sedenion zero-divisors would
      contradict an unrestricted reading. Superseded/forensic ledger copies exist
      (confluent-trust-inventory-v5_3.json, v5.13.json, baselines/v5_24.json) —
      these are NOT current; only the v0.3-suffixed file above is, per
      CTH/MANIFEST.md's Source-of-Truth table. root-audit-register.json's
      changelog notes AXIOM-1 was moved to "bucket-3 OPEN" 2026-09-18 (PR #659).

  - id: cth:ROOT-Prefix-Taxonomy
    prefLabel: "ROOT prefix taxonomy (AXIOM- / POST- / META- / INTERP-)"
    definition: >
      The four prefixes classifying a root-ledger record's kind:
      ROOT_PREFIXES = ("AXIOM-", "POST-", "META-", "INTERP-"). A record in
      meta_axiom, meta_principles, axioms, or interpretations whose id starts
      with one of these. INTERP- records additionally carry
      provenance_kind: philosophy — interpretive/semantic claims, not proof-apt.
    status: derived
    axiom_grounding: "Independent of any single axiom — this is the CTH ledger's own classification scheme for how roots (axioms, postulates, meta-principles, interpretations) are typed. Schema v0.3.4."
    broader: []
    narrower: [cth:AXIOM-1]
    related: [cth:four-bucket-audit]
    source:
      - file: /home/prime/Documents/QBP-implementor/scripts/root_audit.py
        quote: "ROOT_PREFIXES = (\"AXIOM-\", \"POST-\", \"META-\", \"INTERP-\")"
      - file: /home/prime/Documents/confluent-trust/schema/inventory.schema.json
        quote: "$defs.Interpretation (canonical — confluent-trust main 6e8a84f, x-schema-semver 0.3.5; the QBP copy below is a byte-identical vendored mirror)"
      - file: /home/prime/Documents/QBP-implementor/docs/cth/inventory.schema.v0.3.json
        quote: "$defs.Interpretation carries provenance_kind: philosophy + decision_state + kill_condition"
    notes: "Only AXIOM-1 (cth:AXIOM-1) is harvested by id in this first draft; POST-/META-/INTERP- example records are an extension-path item (README.md)."
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661950

  - id: cth:decision_state
    prefLabel: "decision_state (open | settled)"
    definition: >
      "'open' = an open question with a stated falsifier (bucket 3); 'settled' =
      proved/forced (bucket 1/2)... Invariant: decision_state:open REQUIRES a
      non-empty kill_condition — nothing parks open without a kill."
    status: derived
    axiom_grounding: "Schema-level CTH machinery, not itself derived from an axiom — it is the mechanism BY WHICH axioms like AXIOM-1 carry their own open/settled status."
    broader: []
    narrower: []
    related: [cth:kill_condition, cth:AXIOM-1, cth:four-bucket-audit]
    source:
      - file: /home/prime/Documents/confluent-trust/schema/inventory.schema.json
        quote: "$defs.DecisionState (canonical — confluent-trust main 6e8a84f, x-schema-semver 0.3.5; the QBP copy below is a byte-identical vendored mirror)"
      - file: /home/prime/Documents/QBP-implementor/docs/cth/inventory.schema.v0.3.json
        quote: "$defs.DecisionState — see definition above, canonical v0.3.4"
      - file: /home/prime/Documents/Edda/doc/stage1a-e2-open-settled-spec.md
        quote: "EDDA-AUTH-018 — exercise-before-settle (an open/unsettled step presented at an `exercise` site — the grant is non-exercisable until settled)"
    notes: >
      Canonical. EDDA USAGE (edda#48, E2, merged to edda Main): the same open|settled
      vocabulary is realized as a linear proof-state handle, settle(s): Step[open] ⊸
      Step[settled], with a grant-gate: `exercise` requires a grantable cap AND a
      Step[settled] witness, so a grant is non-exercisable until settled
      (exercise-before-settle → EDDA-AUTH-018; use-after-settle → EDDA-AUTH-017). Per the
      merged E2 spec, settle yields only the settled witness and does NOT mint a cap; the
      exercise verb is the v0.3 B1 process-witness node. In Edda, "settled" therefore
      carries an authority consequence, not only a status.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661950
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224687133

  - id: cth:kill_condition
    prefLabel: "kill_condition"
    definition: >
      Array of KillConditionEntry {kill, closure, discharge?, question?,
      trigger_issue?} — one Impasse Record on a root: the ledger-observable
      event that fires the kill, plus how the open question would close. `kill`
      is the falsifier (non-placeholder, minLength 8); `discharge` is required
      iff closure is in {derivation, measurement}.
    status: derived
    axiom_grounding: "none — CTH schema mechanism; see cth:decision_state."
    broader: []
    narrower: []
    related: [cth:decision_state, cth:closure, cth:AXIOM-1]
    source:
      - file: /home/prime/Documents/confluent-trust/schema/inventory.schema.json
        quote: "$defs.KillConditionEntry (canonical — confluent-trust main 6e8a84f, x-schema-semver 0.3.5; the QBP copy below is a byte-identical vendored mirror)"
      - file: /home/prime/Documents/QBP-implementor/docs/cth/inventory.schema.v0.3.json
        quote: "$defs.KillConditionEntry"
    notes: "Canonical. AXIOM-1's own kill_condition array (2 entries) is the worked example carried in cth:AXIOM-1 above."
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661950

  - id: cth:ProofState
    prefLabel: "ProofState (verified | partial | written)"
    definition: >
      "Rollup state of a proof-bearing anchor per design §4.1." `written` = the
      file resolves but carries no verification block — explicitly NOT a proof:
      "proof_state:written + no verification + native_decide is not a proof."
    status: derived
    axiom_grounding: "none — CTH schema mechanism for grading formal claims."
    broader: []
    narrower: []
    related: [cth:closure, spike:FormalityGradient, cth:proof_assistants]
    source:
      - file: /home/prime/Documents/confluent-trust/schema/inventory.schema.json
        quote: "$defs.ProofState (canonical — confluent-trust main 6e8a84f, x-schema-semver 0.3.5; the QBP copy below is a byte-identical vendored mirror)"
      - file: /home/prime/Documents/QBP-implementor/docs/cth/inventory.schema.v0.3.json
        quote: "$defs.ProofState"
      - file: /home/prime/Documents/QBP-implementor/docs/rca/cth-proof-evidence-process-2026-09-02.md
        quote: "proof_state:written + no verification + native_decide is not a proof"
    notes: "Canonical. Proof-assistant (PA) grading (confluent-trust#108 / inter#150) is a separate, derived axis that post-dates the v0.1 cut — see cth:proof_assistants and the pa_local / pa_effective fields on cth:Anchor."
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661950
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661958

  - id: cth:closure
    prefLabel: "closure (derivation | measurement | ruling-rescope)"
    definition: >
      "'derivation'/'measurement' name a resolving anchor in discharge;
      'ruling-rescope' closes only when the kill fires (a constitutional
      change), so discharge is legitimately absent."
    status: derived
    axiom_grounding: "none — CTH schema mechanism."
    broader: []
    narrower: []
    related: [cth:kill_condition, cth:AXIOM-1, spike:ProductProjectionProvenance, cth:claim-source-manifest]
    source:
      - file: /home/prime/Documents/confluent-trust/schema/inventory.schema.json
        quote: "$defs.KillConditionEntry.closure (canonical — confluent-trust main 6e8a84f, x-schema-semver 0.3.5; the QBP copy below is a byte-identical vendored mirror)"
      - file: /home/prime/Documents/QBP-implementor/docs/cth/inventory.schema.v0.3.json
        quote: "$defs.KillConditionEntry.closure"
    notes: >
      Canonical. AXIOM-1's two kill_condition entries use closure: derivation and
      closure: ruling-rescope respectively — both live examples. DISAMBIGUATION: this is
      the kill-condition closure KIND. It is unrelated to the PA layer's claim-source
      import closure (the transitive set of same-repo files a proof's statement depends
      on, hashed into pinned_sha), which is cth:claim-source-manifest.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661950
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224680997

  - id: cth:four-bucket-audit
    prefLabel: "Four-bucket audit (PROVED / FORCED / OPEN / RETIRED)"
    definition: >
      root_audit.py's D1 "ROOT GATE": bucket 1 PROVED (forced_by -> PROOF-*
      anchor, verified); bucket 2 FORCED (forced_by -> MEAS-* anchor
      coherent/converged, or decision_state:settled + a ruling citing a
      GitHub issue/PR); bucket 3 OPEN (non-empty kill_condition +
      decision_state:open — "an open root is an Impasse Record, not a
      request"); bucket 4 RETIRED (in retired_axioms/retired_principles).
      Unsorted -> HARD FAIL unless registered.
    status: derived
    axiom_grounding: "none — this is the audit mechanism applied TO axioms/postulates including AXIOM-1, not derived from one. Mechanises the beekeeper's 2026-09-11 zero-axiom standard."
    broader: []
    narrower: []
    related: [cth:decision_state, cth:AXIOM-1, cth:ProofState]
    source:
      - file: /home/prime/Documents/QBP-implementor/scripts/root_audit.py
        quote: "docstring defining the four buckets, see definition above"
    notes: "AXIOM-1 currently sorts into bucket 3 OPEN per root-audit-register.json's 2026-09-18 changelog entry."

  - id: cth:belief-tiers
    prefLabel: "Belief tiers (= Notary Trust Tier x PA grade)"
    definition: >
      The grade of belief a claim has earned, read as the pair (Notary Trust Tier
      set, PA grade): which verification rungs T0-T7 its evidence reached, with
      their trust base (notary:TrustTier), and how many clean, corresponding proof
      assistants checked it, 0 / 1 / 2 (cth:proof_assistants). No separate "belief
      tier" enum exists; the term is this product.
    status: derived
    axiom_grounding: "none — composite of the Notary verification lineage and the CTH PA-grading mechanism."
    broader: []
    narrower: []
    related: [notary:TrustTier, cth:proof_assistants, cth:AnchorStatus, cth:ProvenanceKind]
    source:
      - file: https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133
        quote: "\"`cth:belief-tiers`: accepted as notary trust tier × PA grade, status unlocated → derived, with @cth-implementor's co-sign (it's a CTH term).\""
      - file: /home/prime/Documents/notary/doc/competencies-and-tiers.md
        quote: "\"## Trust Tiers T0–T7 — a SET with explicit trust base, not a scalar\" (notary main fc20c36)"
      - file: /home/prime/Documents/confluent-trust/internal/pa/pa.go
        quote: "package doc: 'PA is DERIVED, never typed' (confluent-trust main 6e8a84f)"
    notes: >
      RESOLVED 2026-10-22 by beekeeper ruling (inter#173): unlocated -> derived, as
      notary:TrustTier x PA grade. AWAITING @cth-implementor's CO-SIGN: the ruling
      makes the co-sign part of the acceptance because this is a CTH term; until it
      is recorded on inter#173 this mapping is not final. The source for the mapping
      is the ruling, a GitHub PR comment whose URL stands in the file field. HISTORY
      (v0.1-v0.3.0, status unlocated): no literal "belief tier" scheme was found in
      the CTH corpus. The closest analogs were the anchor Status enum
      (cth:AnchorStatus), ProvenanceKind (cth:ProvenanceKind), and a prose reference
      to Dempster-Shafer belief functions and Jøsang subjective-logic triples in
      CTH/Archive/Confluent-Trust-Hypergraph-Theory-v0_2.md. In the inter#164 review
      the Notary proposed Trust Tiers + PA grade as the answer.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: cth:Anchor
    prefLabel: "Anchor (PROOF- / DERIV- / CONJ- / MEAS- / … kinds)"
    definition: >
      A proof-bearing or evidence-bearing ledger record. Its kind is classified by
      provenance_kind (cth:ProvenanceKind); the id prefix is a naming convention
      (QBP-local, 22 prefixes documented, not upstream-registered), e.g. PROOF- formally
      proven, DERIV- derivation, CONJ- conjecture, MEAS- measurement, PRED- prediction,
      OBS- observation. AXIOM-/POST-/META-/INTERP- ids live in the ledger's root lists,
      not among anchors (cth:ROOT-Prefix-Taxonomy). Anchors carry ProofState and, as of
      ledger 6.17.0, the PA-grade fields pa_local / pa_effective (integers 0..2,
      computed-not-declared, CI-reconciled) alongside proof_assistants. Per the CTH/Wyrd
      integration doc, anchors map onto Wyrd Nodes.
    status: derived
    axiom_grounding: "none directly — the general ledger unit that AXIOM-1's own kill_condition entries reference (e.g. PROOF-42zd, DERIV-arrow)."
    broader: []
    narrower: []
    related: [cth:ProofState, cth:AnchorStatus, cth:ProvenanceKind, wyrd:CTHIntegration, cth:proof_assistants, cth:claim-source-manifest, cth:derivation-edge]
    source:
      - file: /home/prime/Documents/QBP-implementor/archive/cth-inventory/confluent-trust-inventory-v5_3.v0.3.json
        quote: "PROOF-42zd, DERIV-arrow, DERIV-crystallisation-asymptotic cited inside AXIOM-1's own kill_condition text"
      - file: /home/prime/Documents/QBP-implementor/archive/cth-inventory/confluent-trust-inventory-v5_3.v0.3.json
        quote: "version 6.17.0 (QBP#697, master 516dfcb; unchanged at master 3b73b24): PROOF-cd-structure-constant-tables and PROOF-fano-table-equals-cd-products pa_local 2 / pa_effective 2; PROOF-hessian 0 / 0"
      - file: /home/prime/Documents/QBP-implementor/docs/cth/qbp-local-extensions.md
        quote: "§Anchor fields (QBP#692): pa_local / pa_effective are QBP-local extensions, 'computed-not-declared'; §Anchor ID prefixes table (22 prefixes)"
    notes: >
      Definition assembled from usage across the ledger schema and AXIOM-1's own record;
      not a single quoted docstring. pa_local / pa_effective are a QBP-local extension;
      canon adoption is tracked at confluent-trust#113 (confluent-trust#111 superseded).
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224665515
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224681119
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661958

  - id: cth:AnchorStatus
    prefLabel: "Anchor Status enum"
    definition: "coherent, untested, incoherent, contested, refuted, killed, marginal, converged, falsified."
