    notes: >
      RULED 2026-10-22 (beekeeper, inter#173; recorded by qbp-architecture). The
      first source is a GitHub PR comment, not a repo file; its URL stands in the
      file field. HISTORY (kept, not erased): two senses were attested at v0.1:
      (1) BMA/Systema/Edda, capability = tool, a raw/primitive ability held
      (fed:FourLayerRegistry layer 1, "Tools: Raw capabilities"); (2) the
      hypergraph-generativity spike, capability = what a skill grants when
      instantiated. The beekeeper RATIFIED on 2026-09-27 "tool = primitive
      capability; a skill, instantiated, grants a composite capability" (the
      RECORD.md reconciliation above). The inter#164 review then raised Bragi's
      reading, "Tool = instrument, Capability = authority". The 2026-10-22 ruling
      SUPERSEDES the "tool = primitive capability" half of the 2026-09-27 ruling
      and KEEPS its skill half: a tool is now the instrument only, and a capability
      also needs authority and allocated capacity. Until v0.4.0, fed:Tool and
      edda:Cap were listed as narrower kinds of capability; they are now components
      of it (related), not kinds. TERMINOLOGY DRIFT left in sources: the BMA spec
      still words registry layer 1 as "Raw capabilities", and Edda's v0.3 glossary
      (Cap entry, edda Main 9d571a5) still cites the 2026-09-27 relation. Both
      predate this ruling; updating them is the owning seats' call.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: fed:Tier
    prefLabel: "Tier (disambiguation — not itself a concept)"
    definition: >
      A homonym index, not a concept. "Tier" names six distinct concepts in the
      federation; always say which one is meant: the Wyrd algebraic tier
      ℂ⊂ℍ⊂𝕆⊂𝕊 (wyrd:Tier); the BMA memory tier T0-T4 (bma:MemoryTier); the CTH
      anchor tier axiom/proof/measurement/prediction (cth:AnchorTier); the Notary
      Trust Tier T0-T7, a set with explicit trust base (notary:TrustTier); the
      Contextus retention tier Core/Near/Peripheral/Distant/Skeleton
      (contextus:RetentionTier); and the Edda application-authority tier
      teacup/one_cup/two_cup/three_cup (edda:AuthorityTier).
    status: derived
    axiom_grounding: "n/a — a disambiguation entry; each sense carries its own grounding."
    broader: []
    narrower: []
    related: [wyrd:Tier, bma:MemoryTier, cth:AnchorTier, notary:TrustTier, contextus:RetentionTier, edda:AuthorityTier]
    source:
      - file: https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133
        quote: "\"Tier: split, with a sense index. Each sense becomes its own concept id in its owner's namespace (`wyrd:Tier` stays the algebraic one, and `bma:MemoryTier` already exists). `fed:Tier` becomes a disambiguation entry listing the senses.\""
    notes: >
      Created in v0.4.0 per the beekeeper ruling on inter#173. The source is a GitHub
      PR comment; its URL stands in the file field. The six senses were first
      enumerated in wyrd:Tier's notes at v0.3.0. Its status tag reflects that the
      index itself is ruled, not that the six senses are one concept. Edda's
      language theory v0.3 glossary already points readers here ("the federation
      ontology records multiple").
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  # ==========================================================================
  # FED — forging & weaving (federation process vocabulary). Ratified 2026-10-08:
  # inter#160 → #165 (reconciliation), inter#161 r2 → #166 (weave orientation).
  # ==========================================================================

  - id: fed:forging
    prefLabel: "forging"
    definition: >
      The method: a chain of retained, risk-ordered strikes that de-risks and builds a capability; repo-agnostic. Forging says how an increment is made and hardened; weaving (§1b) says its topology.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: [fed:strike]
    related: [fed:thread, fed:fabric, fed:executable-specification]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          "Forging is how we build something durable and de-risked: a sequence of strikes (thin, end-to-end increments) that are kept and grown, each advancing only when its executable specification is green."
    notes: >
      RATIFIED 2026-09-27 (inter#135); reconciled 2026-10-08 (inter#160/#165). Cross-repo 'Damascus melding' is the common case, not a second definition.

  - id: fed:thread
    prefLabel: "thread (weft)"
    definition: >
      The ephemeral, parallel conceptual-development unit within a sprint, where intent, theory and per-repo spec-deltas are spelled out and where spikes run; converts into one or more strikes once its executable specification is fully defined. Two kinds: warp thread (one repo) and weft thread (cross-repo). 'Weft' is this same concept named for its cross-repo orientation (weft ≡ thread).
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: []
    related: [fed:strike, fed:spike, fed:warp, fed:crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1a: "A thread is the ephemeral conceptual-development unit within a sprint." §1b: "Weft ≡ thread (§1a): one concept, one definition."
    notes: >
      RATIFIED 2026-10-08 (inter#160 → #165; weave orientation inter#161 r2 → #166). Deliberately ONE entry: 'weft' is an alias, not a separate term (deming refinement R3), so the two names cannot drift apart.

  - id: fed:strike
    prefLabel: "strike"
    definition: >
      One retained increment of forging. Entry: its executable specification is fully defined. Exit (lands): that executable specification is green, not when its build merges (Governing Principle 2). Kinds: warp strike (repo-local) and weft strike / pick (cross-repo, lands on its meta-lock).
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:forging]
    narrower: [fed:pick]
    related: [fed:executable-specification, fed:meta-lock, fed:thread]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          "Governing principle 2: a strike is not done when its build merges — it is done when its executable specification is green."

  - id: fed:spike
    prefLabel: "spike (forging sense)"
    definition: >
      A time-boxed, disposable probe that answers an explicit question and outputs a capability-gap list; runs in the thread phase, before a strike is defined. Distinct from the `spike:` namespace, which holds terms from one specific spike (hypergraph generativity).
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: []
    related: [fed:thread, fed:strike]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §3: "A spike is a time-boxed, exploratory investigation to reduce uncertainty. Its product is knowledge, not shipped software."
    notes: >
      Disambiguation: `fed:spike` = the method's probe; `spike:*` = vocabulary harvested from the 2026-09-25 hypergraph-generativity spike.

  - id: fed:executable-specification
    prefLabel: "executable specification"
    definition: >
      The CI-gated oracle a strike lands against: one assertion per finding, retained permanently as a regression guard. Historical aliases: 'lock', 'edda-lock'.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: [fed:meta-lock]
    related: [fed:strike, fed:crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §4: "An executable specification is a CI-gated test-set with one assertion per finding the spike raised, retained permanently and run as a regression guard"

  - id: fed:meta-lock
    prefLabel: "meta-lock"
    definition: >
      The aggregate of a cross-repo strike's per-repo locks; it IS that strike's executable specification, not a separate gate. The strike lands only when every per-repo lock is green.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:executable-specification]
    narrower: []
    related: [fed:pick, fed:crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §4: "a cross-repo strike's executable specification is the meta-lock, the aggregate of its per-repo locks."

  - id: fed:warp
    prefLabel: "warp"
    definition: >
      A repo's own lengthwise progression (spec, backlog, roadmap). A seat tends exactly one warp, its write axis (Seat Charter R1); everything else it touches is a crossing or a read.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: []
    related: [fed:thread, fed:crossing, fed:float]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "A seat tends exactly one warp, its write axis (Seat Charter R1). Everything else it touches is a crossing or a read."

  - id: fed:crossing
    prefLabel: "crossing"
    definition: >
      Where a weft or a consumer meets another warp: a per-repo spec-delta proven by that repo's lock. Requires a bidirectional link across the strike or seam record, the issue on the crossed repo, and the lock's verification handle.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: [fed:standing-crossing]
    related: [fed:warp, fed:thread, fed:meta-lock, fed:float]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "Without links in both directions it is not a crossing."

  - id: fed:standing-crossing
    prefLabel: "standing crossing"
    definition: >
      A persistent crossing: a consumption seam where one warp continuously consumes another's output. Its lock is a handle (grade + pinned source sha + artifact tie). It carries the handle, not the upstream justification.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:crossing]
    narrower: []
    related: [fed:float, fed:fabric]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "A standing crossing carries the handle, not the upstream justification."
    notes: >
      Worked instance: qbp-compute-unit's tie to the proven Fano table (PROOF-fano-table-equals-cd-products, PA-2). See inter#162 for the QBP→qbp-systema boundary.

  - id: fed:pick
    prefLabel: "pick"
    definition: >
      One pass of a weft, i.e. one cross-repo strike; it lands on its meta-lock and is recorded in a Strike Record whose index rows are its crossings.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:strike]
    narrower: []
    related: [fed:meta-lock, fed:crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "One pass of a weft, i.e. one cross-repo strike. It lands on its meta-lock (§4)."

  - id: fed:float
    prefLabel: "float"
    definition: >
      A concept present in a warp without a crossing: copied or re-implemented from another warp with no link and no lock. A defect: each one found is converted into a standing crossing with a handle, or justified on record. A load-bearing float (re-implemented and run) is the highest risk.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: []
    related: [fed:crossing, fed:standing-crossing, fed:warp]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "A float is a defect."
    notes: >
      Known instances at ratification (inter#162): Wyrd re-derives 𝕆/𝕊 without importing QBP (vertical float); Craft's wasm re-implements the Fano-axis physics (load-bearing float, the 'blue blip').

  - id: fed:fabric
    prefLabel: "fabric"
    definition: >
      The integrated federation at a sprint target. Fabric-green is computable: every warp's executable specifications green ∧ every weft's meta-lock green ∧ every standing crossing's handle fresh.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: []
    narrower: [fed:fabric-acceptance]
    related: [fed:crossing, fed:forging]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "Fabric-green is computable by walking every crossing's bidirectional links"

  - id: fed:fabric-acceptance
    prefLabel: "fabric acceptance"
    definition: >
      The external check: an end-to-end acceptance suite run against the instantiated fabric, proving correspondence to reality, not just internal consistency.
    status: derived
    axiom_grounding: none — federation process vocabulary (forging method), an independent design lineage; ratified by the beekeeper.
    broader: [fed:fabric]
    narrower: []
    related: [fed:standing-crossing]
    source:
      - file: /home/prime/Documents/inter/best-practices/forging-spikes-strikes-executable-specs.md
        quote: >
          §1b: "A fabric can hold together and still be the wrong cloth."
    notes: >
      For QBP: the physics-acceptance suite owned by qbp-oppenheimer, run against qbp-systema (inter#162).

  # ==========================================================================
  # NOTARY — the federation V&V function. Owner seat: notary-implementor.
  # Added v0.4.0 (beekeeper ruling, inter#173). Private repo: vocabulary only.
  # Verified against notary main fc20c36 (and confluent-trust main 6e8a84f for
  # the notary-request record, whose canonical copy lives there).
  # ==========================================================================

  - id: notary:TrustTier
    prefLabel: "Trust Tier T0-T7 (a set with explicit trust base, never a scalar)"
    definition: >
      A rung of evidence about a claim, each with its own trust dependencies: T0
      compiles and runs; T1 hand-picked unit tests pass; T2 property tests derived
      from Lean theorem statements, with coverage + mutation metrics; T3
      differential against a Lean reference oracle; T4 TLA+ model-checked via TLC
      to a stated bound (the bound's justification is the artifact); T5 production
      traces continuously validate against the TLA+ spec; T6 Iris refinement proof
      via Goose-style translation; T7 end-to-end verified to machine code
      (aspirational). A verification reports the SET of tiers achieved plus the
      union of trust dependencies, never a single number.
    status: derived
    axiom_grounding: "none — Notary verification design (BMA Theory v3.0 §3.1-§3.6), an independent lineage from AXIOM-1."
    broader: []
    narrower: []
    related: [fed:Tier, notary:verification_outcome, cth:proof_assistants, cth:belief-tiers]
    source:
      - file: /home/prime/Documents/notary/doc/competencies-and-tiers.md
        quote: >
          "## Trust Tiers T0–T7 — a SET with explicit trust base, not a scalar ...
          The scheme exists to prevent collapse to a single number ("this module is
          Tier 4"). Emit the **union of tiers achieved** plus the **union of trust
          dependencies**." (notary main fc20c36)
      - file: /home/prime/Documents/notary/CLAUDE.md
        quote: >
          "`trust_tiers_achieved` is a **set with explicit trust base**, never a
          scalar ("this is T4")." (notary main fc20c36)
    notes: >
      Split out of wyrd:Tier's v0.3.0 sense list per the 2026-10-22 beekeeper ruling
      (inter#173). Distinct from the PA grade 0/1/2 (cth:proof_assistants): Trust
      Tiers grade a verification method's evidence, the PA grade counts clean,
      corresponding proof assistants. Tier disagreement between rungs is recorded as
      an epistemic seam, never a silent demote. Notary's authoritative framework is
      BMA Theory v3.0 §3.1-§3.6 and its launch prompt; the condensed reference above
      defers to them.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: notary:verification_outcome
    prefLabel: "verification_outcome (six values; INCONCLUSIVE is first-class)"
    definition: >
      The outcome of one Notary verification cycle, exactly one of six values:
      VERIFIED (proof completed; named trust tiers achieved); COUNTEREXAMPLE_FOUND
      (disconfirming evidence; name the scenario); INCONCLUSIVE_TIMEOUT (resource
      budget exhausted; name residual subgoals); INCONCLUSIVE_RESOURCE_BOUND (bound
      prevents completion; name bound + alternative); INCONCLUSIVE_UNREACHED_GOAL
      (proof obligation not discharged; name the obligation);
      REFUSED_INSUFFICIENT_SPEC (input spec ambiguous/incomplete; name the
      clarification).
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [notary:TrustTier, notary:PA-record]
    source:
      - file: /home/prime/Documents/notary/templates/NT_NOTARY_VERIFICATION_EVIDENCE.template.yaml
        quote: >
          "# ---- OUTCOME: exactly one of the six values" followed by the six values
          and glosses quoted in the definition (notary main fc20c36)
      - file: /home/prime/Documents/notary/CLAUDE.md
        quote: >
          "`verification_outcome` is one of six values — **four name distinct
          INCONCLUSIVE shapes**. `INCONCLUSIVE_*` is a **first-class output**, not a
          failure to disguise." (notary main fc20c36)
    notes: >
      COUNT NOTE: the "four INCONCLUSIVE shapes" are the three INCONCLUSIVE_* values
      plus REFUSED_INSUFFICIENT_SPEC; only three carry the INCONCLUSIVE_ prefix. A
      VERIFIED verdict is "a structured absence of disconfirming evidence at named
      tiers", not a claim that the code is correct (notary CLAUDE.md). Not the same
      vocabulary as the verification skill's VERIFIED / VERIFIED-WITH-CAVEAT /
      REFUTED / UNVERIFIABLE (inter skills/verification.md), which grades a claim
      checked against the live system.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: notary:PA-record
    prefLabel: "PA-record (the proof-assistant evidence block a Notary cycle emits)"
    definition: >
      The PA-grading block of a Notary verification record: one proof_assistants
      entry per assistant (lean4 | coq | agda), each with an evidence_ref, the
      producer seat, a declared{} block (informational only), a derived{} block
      ("the graded truth", including kernel_clean) and a veto-only trust_check; plus
      a correspondence record, corroborated_by annotations that never raise the
      grade, and flags. "DERIVE-DON'T-DECLARE: grading reads `derived{}` only".
    status: derived
    axiom_grounding: none
    broader: []
    narrower: [notary:kernel_clean, notary:correspondence]
    related: [cth:proof_assistants, notary:cross-prover, notary:notary-request, notary:verification_outcome]
    source:
      - file: /home/prime/Documents/notary/templates/NT_NOTARY_VERIFICATION_EVIDENCE.template.yaml
        quote: >
          "# ---- PA-RECORD (testdata/pa v2 format — verbatim-aligned to notary#1 /
          confluent-trust#108) ... DERIVE-DON'T-DECLARE: grading reads `derived{}`
          only; declared{} is informational." (notary main fc20c36)
    notes: >
      The PA GRADE itself (0 / 1 / 2) is computed by the CTH engine and is already
      recorded at cth:proof_assistants; it is related here, not duplicated as a
      notary: term. This record is the Notary-side evidence that grade is derived
      from.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: notary:kernel_clean
    prefLabel: "kernel_clean"
    definition: >
      A boolean in a PA-record's derived{} block: whether the assistant's own kernel
      accepted the proof without a trust shortcut. It sits with the tactics and
      axioms actually used, which grading reads, not the declared ones. A record
      that fails it can carry the flag not_kernel_clean (as the cycle-7 hessian
      record does).
    status: derived
    axiom_grounding: none
    broader: [notary:PA-record]
    narrower: []
    related: [notary:cross-prover, cth:proof_assistants]
    source:
      - file: /home/prime/Documents/notary/templates/NT_NOTARY_VERIFICATION_EVIDENCE.template.yaml
        quote: >
          "derived:  {tactics_used: [], axioms: [], exit_code: 0, output_hash: "",
          kernel_clean: false}  # the graded truth" (notary main fc20c36)
      - file: /home/prime/Documents/notary/proofs/FanoTableCrossProver.v
        quote: "(* kernel's OWN conversion — NOT vm_compute/native_compute (PA-2 bar) *) (notary main fc20c36)"
    notes: >
      Definition paraphrased from the template field and its use in the evidence
      records (e.g. cycle-9: "kernel-clean", standard axioms, "NO ofReduceBool, NO
      sorryAx"). The exact admissible-axiom rule belongs to the PA engine
      (cth:proof_assistants), not this vocabulary entry.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: notary:cross-prover
    prefLabel: "cross-prover (two distinct kernels)"
    definition: >
      Verification of the same claim in two proof assistants with distinct kernels
      (the lean_coq_port competency: port a Lean theorem's statement and proof to
      Coq and check the Coq kernel accepts it). It flags drift between provers, and
      it is what a PA-2 grade needs: two kernel-clean assistants whose statements a
      non-producer has recorded as corresponding.
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [notary:kernel_clean, notary:correspondence, cth:proof_assistants]
    source:
      - file: /home/prime/Documents/notary/doc/competencies-and-tiers.md
        quote: >
          "**Lean→Coq porting and re-proof** — cross-prover validation. Port a Lean
          theorem's statement and proof to Coq; verify the Coq kernel accepts it.
          T0–T3 structural evidence; flags semantic drift between provers."
          (notary main fc20c36)
      - file: /home/prime/Documents/notary/evidence/cycle-8-cd-headline-v2-2026-10-02.yaml
        quote: "\"both kernel-clean, distinct kernels\" ... \"Genuine headline PA-2 (not a relabel). Two independent kernels accept the anchor's OWN statement\" (notary main fc20c36)"
    notes: >
      The CTH-side rule is kernel diversity: a correspondence lifts a grade only
      through a different prover kernel (cth:proof_assistants).
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: notary:correspondence
    prefLabel: "correspondence (with non-producer checked_by)"
    definition: >
      The PA-record entry asserting that two assistants' statements are the same
      claim: {corresponds, basis, checked_by, checked_at}, where checked_by MUST
      differ from every producer. A correspondence a producer records for its own
      work is flagged self_attested_correspondence and does not count.
    status: derived
    axiom_grounding: none
    broader: [notary:PA-record]
    narrower: []
    related: [notary:cross-prover, cth:proof_assistants]
    source:
      - file: /home/prime/Documents/notary/templates/NT_NOTARY_VERIFICATION_EVIDENCE.template.yaml
        quote: >
          "correspondence: {corresponds: false, basis: "", checked_by: "", checked_at:
          ""}  # checked_by MUST differ from every producer" ... "flags: []  #
          declared_mismatch | hash_mismatch | wrong_role | self_attested |
          self_attested_correspondence" (notary main fc20c36)
      - file: /home/prime/Documents/confluent-trust/internal/pa/pa.go
        quote: "package doc: 'Two assistants count as two only if a NON-PRODUCER recorded that their statements correspond.' (confluent-trust main 6e8a84f)"
    notes: >
      HOMONYM: distinct from a cross_formalism_correspondence (an
      NT_CROSS_FORMALISM_CORRESPONDENCE node relied on by a cycle; notary
      doc/failure-modes.md), which tracks correspondences between formalisms as
      first-class nodes rather than the per-record PA check.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

  - id: notary:notary-request
    prefLabel: "notary-request record (v1.3)"
    definition: >
      "The locked notary#3 v1.3 emit record. One JSON object per
      shortfall/staleness/tie event", appended as JSON lines to a CI artifact the
      filer consumes. reason is one of pa_shortfall, staleness,
      artifact_tie_mismatch; the record names the claim, its pinned source sha, the
      required and current PA, the pinning consumers and whether it is stale.
      Dedupe key = (claim_id, source_sha, reason, artifact_digest).
    status: derived
    axiom_grounding: none
    broader: []
    narrower: []
    related: [notary:PA-record, cth:proof_assistants, cth:claim-source-manifest]
    source:
