        quote: "'The output model' section, lines 20-28 (verified directly 2026-09-27)"
    notes: >
      This is the SAME dual-readability requirement (L must be human AND
      machine readable) this ontology itself is built to satisfy — the
      ontology dogfoods this pattern, not just AXIOM-1's provenance discipline.
      Also NOTE: this section calls L "a projection functor" — see the naming
