  # ==========================================================================
  # WYRD — quaternion-native typed holographic hypergraph DB
  # ==========================================================================

  - id: wyrd:Tier
    prefLabel: "Tier (algebraic privilege tower ℂ ⊂ ℍ ⊂ 𝕆 ⊂ 𝕊)"
    definition: >
      "A position in the Cayley-Dickson algebraic privilege tower... Each tier
      corresponds to a doubling of the previous algebra and a strict loss of an
      algebraic property (commutativity at ℂ→ℍ, associativity at ℍ→𝕆,
      alternativity at 𝕆→𝕊)." TierComplex=2 components (user-facing),
      TierQuaternion=4 (supervisor/Hamilton), TierOctonion=8 (kernel),
      TierSedenion=16 (firmware, outermost).
    status: derived
    axiom_grounding: >
      GENUINE CHAIN to cth:AXIOM-1: AXIOM-1's statement explicitly "selects
      division algebras (no zero divisors)". ℂ, ℍ, 𝕆 are division algebras
      (no zero divisors); 𝕊 (sedenions) is NOT — it has zero divisors (per
      AXIOM-1's own kill_condition, PROOF-42zd asserts 42 of them). So the tier
      boundary at 𝕆→𝕊 is precisely where AXIOM-1's selection clause would bite
      if its scope is unrestricted — which is AXIOM-1's own still-OPEN
      QUESTION 2. This ontology inherits that open-ness: the tier tower's
      privileged-vs-not boundary is grounded in AXIOM-1, but AXIOM-1 itself has
      not settled how far that grounding reaches.
    broader: []
    narrower: []
    related: [cth:AXIOM-1, wyrd:HolographicProperty, edda:BornRule]
    source:
      - file: /home/prime/Documents/Wyrd/model/tier.go
        quote: "lines 8-37, Tier type + doubling/property-loss docstring"
      - file: /home/prime/Documents/Wyrd/lean/Wyrd/Foundations.lean
        quote: "proves no ring homomorphism from inner->outer tier is surjective (T2.1.a/b/c)"
    notes: >
      Enforced at runtime by the "Skuld supervisor" via compute.CanSynthesize.
      Distinct from BMA's memory Tier (0-4, see bma:MemoryTier) and CTH's own
      Anchor.Tier (axiom/proof/measurement/prediction) — a three-way "Tier"
      naming collision across the federation, flagged explicitly in
      /home/prime/Documents/Wyrd/doc/integration/cth.md. Recommend the ontology
      (and future docs) always qualify which Tier is meant.

  - id: wyrd:Node
    prefLabel: "Node / NodeType"
    definition: >
      Node{ID, Type, Tier, Created, Payload, TierImmune, Salience}. NodeType is
      "a free-form classification chosen by the consumer" (CTH/BMA/Contextus
      each define their own); Wyrd reserves only the wyrd. prefix. TierImmune
      exempts a node from all automatic eviction. Salience (0.0-1.0) modulates
      eviction priority.
    status: derived
    axiom_grounding: "none — engineering data structure, not derived from an axiom."
    broader: []
    narrower: [bma:NodeType]
    related: [wyrd:Hyperedge, wyrd:Salience]
    source:
      - file: /home/prime/Documents/Wyrd/model/node.go
        quote: "lines 8-66"
    notes: "Salience is incremented by Hebbian reinforcement, decremented by Ebbinghaus decay."

  - id: wyrd:Hyperedge
    prefLabel: "Hyperedge (Heads / Tails / Transit)"
    definition: >
      Hyperedge{ID, Nodes []NodeID, Weight, IsSymmetric, Heads []int, Tails
      []int}. Heads/Tails are index sets into Nodes encoding orientation
      ("Heads = upstream, Tails = downstream" is the CTH-opcode convention;
      semantics are tenant-defined); their intersection must be empty. Nodes in
      neither set are "transit" — present in the edge but not directional
      endpoints (the "N-to-M-with-transit" pattern, PR #31 §3). Symmetric edges
      must have empty Heads/Tails.
    status: derived
    axiom_grounding: "none directly — but see wyrd:HolographicProperty, the Lean-proven property of exactly this structure at arity >= 3."
    broader: []
    narrower: []
    related: [wyrd:Node, wyrd:HolographicProperty, spike:Leader]
    source:
      - file: /home/prime/Documents/Wyrd/model/hyperedge.go
        quote: "lines 26-53, struct + TransitNodes()"
    notes: "spike:Leader's skill anatomy explicitly maps a skill onto this shape: Tails = inputs, Transit = transform, Heads = outputs (RECORD.md)."

  - id: wyrd:HolographicProperty
    prefLabel: "Holographic property"
    definition: >
      "A hyperedge of arity k >= 3 carries information that CANNOT be recovered
      from any decomposition into smaller-arity edges. Consumers MUST NOT
      silently split a k-edge into k(k-1)/2 pair edges." Lean-proven (PROT-HH-001
      Theorem 2): "a 3-beam coherent recording is NOT equivalent to three
      independent pairwise recordings... The irreducibility resides in PHASE
      COHERENCE: a 3-beam recording binds three relative phases under the
      constraint of triangle consistency." The map from triple-coherent
      recordings to independent pairs is NOT surjective.
    status: derived
    axiom_grounding: "none direct to AXIOM-1 (this is a separate proven theorem about hyperedge structure, not about information-preservation under physical process) — flag as its own, independently Lean-verified claim."
    broader: []
    narrower: []
    related: [wyrd:Hyperedge, cth:ProofState]
    source:
      - file: /home/prime/Documents/Wyrd/lean/Wyrd/HolographicHypergraph.lean
        quote: "lines 1-60, Theorem 2 statement + docstring"
      - file: /home/prime/Documents/Wyrd/README.md
        quote: "lines 33-35, listed among the four load-bearing Lean-verified invariants"
    notes: "Generalized to all n>=3 in HolographicHypergraphHigherArity.lean. This is the formal grounding for why Wyrd is called a 'holographic' hypergraph DB."

  - id: wyrd:Salience
    prefLabel: "Salience"
    definition: "A 0.0-1.0 field on Node modulating eviction priority; incremented by Hebbian co-activation, decremented by Ebbinghaus decay."
    status: derived
    axiom_grounding: none
    broader: [wyrd:Node]
    narrower: []
    related: []
