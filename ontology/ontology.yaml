  - id: cth:proof_assistants
    prefLabel: "proof_assistants (ProofAssistant attestations — the PA-grade evidence)"
    definition: >
      Array of $defs.ProofAssistant {assistant in {lean4, coq, agda}, evidence_ref,
      trust_check in {pass, fail}} on proof and derivation anchors: "records WHICH
      assistant checked the claim and a pointer to its re-executable evidence. The PA count
      is DERIVED by the engine from the evidence at evidence_ref — never from this record
      alone." trust_check is veto-only. The engine grades a claim 0 (none), 1 (one clean)
      or 2 (two-or-more clean + corresponding — the PA-2 gate); two assistants count as two
      only if a non-producer recorded that their statements correspond.
    status: derived
    axiom_grounding: "none — CTH schema/engine mechanism for grading formal claims."
    broader: [cth:Anchor]
    narrower: []
    related: [cth:ProofState, cth:ProvenanceKind, cth:derivation-edge, cth:claim-source-manifest]
    source:
      - file: /home/prime/Documents/confluent-trust/schema/inventory.schema.json
        quote: "$defs.ProofAssistant (confluent-trust main 6e8a84f, x-schema-semver 0.3.5)"
      - file: /home/prime/Documents/confluent-trust/internal/pa/pa.go
        quote: "package doc: 'PA is DERIVED, never typed ... Two assistants count as two only if a NON-PRODUCER recorded that their statements correspond. Effective PA is the minimum along derivation edges.'"
      - file: /home/prime/Documents/QBP-implementor/docs/cth/qbp-local-extensions.md
        quote: "§Anchor fields: 'Kernel diversity is the maps criterion' — a correspondence may rescue only an assistant whose prover differs from the headline's (QBP master 3b73b24)"
    notes: >
      Landed via confluent-trust#108 / inter#150. Kernel diversity: a cross-prover
      correspondence can lift a headline only through a different prover kernel, and the
      QBP encoder collapses same-kind survivors to one per kernel. confluent-trust#112
      (OPEN) proposes restricting the array to proof/derivation anchors in schema 0.3.6;
      an internal-compute anchor already carries none and grades PA-0 by absence (see
      cth:ProvenanceKind). The Notary-side record vocabulary (the notary-request record,
      canonical at confluent-trust testdata/pa/notary-request.schema.json, "v1.3", dedupe
      key (claim_id, source_sha, reason, artifact_digest)) is left for a possible notary:
      namespace, which is an open beekeeper decision.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/164#discussion_r4224661958
