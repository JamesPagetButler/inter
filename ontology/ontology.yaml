    prefLabel: "Four-bucket audit (PROVED / FORCED / OPEN / RETIRED)"
    definition: >
      root_audit.py's D1 "ROOT GATE": bucket 1 PROVED (forced_by -> PROOF-*
      anchor, verified); bucket 2 FORCED (forced_by -> MEAS-* anchor
      coherent/converged, or decision_state:settled + a ruling citing a
      GitHub issue/PR); bucket 3 OPEN (non-empty kill_condition +
      decision_state:open — "an open root is an Impasse Record, not a
      request"); bucket 4 RETIRED (in retired_axioms/retired_principles).
      Unsorted -> HARD FAIL unless registered.
    status: derived
    axiom_grounding: "none — this is the audit mechanism applied TO axioms/postulates including AXIOM-1, not derived from one. Mechanises the beekeeper's 2026-09-11 zero-axiom standard."
