  - id: cth:AnchorTier
    prefLabel: "Anchor tier (CTH: axiom / proof / measurement / prediction)"
    definition: >
      The CTH ledger's tier on an anchor: "Tier values per Theory v0.2 §4.1" —
      TierAxiom = 0, TierProof = 1, TierMeasurement = 2, TierPrediction = 3. In the
      inventory schema an anchor is "A Tier 1-3 node: proof, measurement,
      prediction, or hypothesis"; axioms are Tier 0.
    status: derived
    axiom_grounding: "none — CTH ledger classification. Tier 0 holds the axioms (cth:AXIOM-1 among them), but the tier scale itself is not derived from AXIOM-1."
    broader: [cth:Anchor]
    narrower: []
    related: [fed:Tier, cth:AnchorStatus, wyrd:CTHIntegration]
    source:
      - file: /home/prime/Documents/confluent-trust/model/enums.go
        quote: "// Tier values per Theory v0.2 §4.1. const ( TierAxiom Tier = 0; TierProof Tier = 1; TierMeasurement Tier = 2; TierPrediction Tier = 3 ) (confluent-trust main 6e8a84f)"
      - file: /home/prime/Documents/confluent-trust/schema/inventory.schema.json
        quote: "\"A Tier 1-3 node: proof, measurement, prediction, or hypothesis.\" ... \"tier\": { \"type\": \"integer\", \"minimum\": 1, \"maximum\": 3 } (confluent-trust main 6e8a84f)"
      - file: /home/prime/Documents/Wyrd/doc/integration/cth.md
        quote: "\"The `model.Anchor.Tier` (CTH-internal: axiom/proof/measurement/prediction) is **not** the same as Wyrd `model.Tier` (algebraic ℂ/ℍ/𝕆/𝕊).\" (wyrd main 5c36988)"
    notes: >
      Split out of wyrd:Tier's v0.3.0 sense list per the 2026-10-22 beekeeper ruling
      (inter#173). The schema also mentions "hypothesis" in the Tier 1-3 description,
      though the Go enum names only proof, measurement and prediction above axiom.
    review_ref:
      - https://github.com/JamesPagetButler/inter/pull/173#issuecomment-6345219133

