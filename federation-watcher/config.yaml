# Federation Watcher — configuration
# Used by watcher.py + consumed by agent terminals via Monitor.

# ── Fan-out mode ──────────────────────────────────────────────────────────
# The watcher runs as a single daemon. Each agent terminal monitors its own
# wake file rather than the watcher's stdout directly.
#
# Watcher daemon (run once, any terminal):
#   nohup python3 ~/Documents/inter/federation-watcher/watcher.py \
#         > ~/.federation-watcher/watcher.log 2>&1 &
#
# Each agent terminal (replace PERSONA with e.g. qbp-architecture):
#   Monitor(command="tail -f -n 0 ~/.federation-watcher/wake/PERSONA",
#           persistent=True)
#
# New agents register by just starting their Monitor — no central config
# change needed. The watcher writes to any persona's wake file the moment
# they appear in a message's mentions list.

# Directory where per-persona wake files live.
# Each file: {wake_dir}/{persona}  (plain text, one event per line)
wake_dir: ~/.federation-watcher/wake

# Personas whose @mentions also fire on the watcher's own stdout.
# Useful when the terminal running the watcher is also an agent terminal.
# Set to [] if running the watcher as a headless daemon.
watch_mentions:
  - qbp-architecture
  - beekeeper

# Canonical seat registry (inter#271 item 3 — roster-only wake files).
# A wake FILE is written only for a handle resolved here OR in
# watch_mentions above (the two are reconciled, not either-or — see
# resolve_roster() in watcher.py). Every other @token gets one log line
# and no file. Same file the heartbeat sweep below already reads; listed
# here too so the roster check works even with heartbeat.enabled: false.
personas_conf: ~/Documents/inter/federation-terminals/personas.conf

# Alias map (inter#271 B1, foreman review 2026-11-01). Some senders still
# address a seat by an older/shorthand handle that was never itself a
# launched seat — the live wake dir had real, actively-used traffic under
# these names (bragi: 211 wakes, latest seq 4238; bma: 28 wakes) landing in
# a file nobody reads. route_wake() resolves an alias to its seat and
# writes ONE wake file for the seat (never the alias's own file), keeping
# the HIGHEST role among all mentions in the message if both the alias and
# the seat are named. Add an entry here instead of teaching senders a new
# handle.
aliases:
  bragi: edda-implementor        # edda-implementor's current persona name
  edda: edda-implementor         # older alias, pre-dates the bragi rename
  bma: bma-implementor
  cth: cth-implementor
  contextus: contextus-impl

# Non-seat consumers that legitimately get a wake file: not a personas.conf
# seat, no Monitor/liveness check of their own, but a real reader exists.
# Document each entry with its reader so this list stays auditable.
extra_recipients:
  - antigravity   # read by ops/watcher/bridge-waker (Nidavellir; reboot
                  # install list, inter#271 B1) — not running today, but a
                  # legitimate consumer, not junk

# Sessionbridge channels to monitor.
# "auto" = discover all *.jsonl files in the channels state directory
# that have no spaces and don't start with '#'.
channels: auto

# Classification filter applied to non-mention messages:
#   off    — only @mentions produce wake events; everything else ignored
#   regex  — pattern-based classification (free, ~0ms per message)
#   haiku  — Claude Haiku API classification (~200ms, costs per call)
#             Falls back to regex on any API failure.
filter_mode: regex

# Poll interval in seconds.
poll_interval: 10

# Haiku model used when filter_mode: haiku
haiku_model: claude-haiku-4-5-20251001

# Busy flag path.
# When this file exists:
#   - @mention wake files are still written (always — §2.i compliance)
#   - IMMEDIATE-classified non-mention items go to deferred queue instead
# Per-persona busy flags are also checked: {busy_flag}.{persona}
#   e.g. ~/.federation-watcher/busy.qbp-architecture
# Set:   touch ~/.federation-watcher/busy
# Clear: rm   ~/.federation-watcher/busy
busy_flag: ~/.federation-watcher/busy

# Runtime state and queue directories (not committed to git)
state_dir: ~/.federation-watcher/state
deferred_queue: ~/.federation-watcher/deferred.jsonl

# ── Monitor-liveness heartbeat (crash-recovery R3, inter#91) ────────────────
# The watcher only *delivers* wake events above — it never verified a seat's
# §2.i Monitor was actually armed to receive them. F3 (2026-08-24 crash
# recovery): two seats' Monitors died silently (process-exit / mid-gap stop,
# no completion record); the seat looked "up" but couldn't hear @mentions.
#
# Each armed Monitor is, concretely, a `tail -f -n 0 wake/{persona}` child
# process on this host (see the fan-out doc above) — so liveness is a plain
# external pgrep, no ack protocol and no write into a healthy seat's own
# wake file (zero added wake-noise). A dead/absent Monitor is written once,
# on the alive->dead transition only, to `notify_persona`'s wake file.
heartbeat:
  enabled: true
  interval: 60                    # seconds between liveness sweeps
  personas_conf: ~/Documents/inter/federation-terminals/personas.conf
  status_file: ~/.federation-watcher/monitor-liveness.json
  notify_persona: deming          # who gets the MONITOR_DEAD/RECOVERED wake line
